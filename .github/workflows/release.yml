name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create GitHub release
        # Single-file release: cow-thermostat-card.js with all 5 Inter woff2
        # fonts inlined as base64. HACS picks this asset by name (matches
        # `filename` in hacs.json) and registers it as the Lovelace module
        # at /hacsfiles/cow-thermostat-card/cow-thermostat-card.js.
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cow-thermostat-card.js
          generate_release_notes: true
