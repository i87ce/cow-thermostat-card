name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package for HACS
        # HACS in zip_release mode looks for ANY .zip asset attached to the
        # release, downloads it, and unzips it into /hacsfiles/<repo>/.
        # The hacs.json `filename` field then points at the entry file
        # WITHIN the unzipped folder (cow-thermostat-card.js), which HACS
        # registers as the Lovelace module resource. So our zip contains
        # the js + 5 woff2, all served from /hacsfiles/cow-thermostat-card/.
        run: |
          cd dist
          zip ../cow-thermostat-card.zip cow-thermostat-card.js inter-*.woff2
          cd ..
          unzip -l cow-thermostat-card.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cow-thermostat-card.zip
            dist/cow-thermostat-card.js
          generate_release_notes: true
