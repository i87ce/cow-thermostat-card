name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package for HACS
        # HACS in zip_release mode downloads this single asset and unzips it
        # into /hacsfiles/cow-thermostat-card/, so cow-thermostat-card.js sits
        # next to the inter-*.woff2 files and the @font-face url("./...")
        # references resolve correctly.
        run: |
          cd dist
          zip ../cow-thermostat-card.zip cow-thermostat-card.js inter-*.woff2
          cd ..
          unzip -l cow-thermostat-card.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cow-thermostat-card.zip
            dist/cow-thermostat-card.js
          generate_release_notes: true
