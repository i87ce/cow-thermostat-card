# Add the following to your Home Assistant configuration.yaml.
# After editing, restart Home Assistant.

# 1. Register the custom card resource (HACS does this for you in storage
#    mode; only needed if you are in YAML-only mode).
frontend:
  extra_module_url:
    - /hacsfiles/cow-thermostat-card/cow-thermostat-card.js
    # Required for the ?kiosk URL parameter to hide HA header + sidebar
    - /hacsfiles/kiosk-mode/kiosk-mode.js

# 2. Register one dashboard per Wall Display.
#    These do NOT show up in the sidebar — they exist only at their direct URL.
lovelace:
  mode: storage  # leave default; per-dashboard "mode: yaml" lets us version the YAML
  dashboards:
    walldisplay-camera:
      mode: yaml
      filename: dashboards/walldisplay-camera.yaml
      title: Camera
      icon: mdi:bed-king
      show_in_sidebar: true
      require_admin: false
    walldisplay-studio-chiara:
      mode: yaml
      filename: dashboards/walldisplay-studio-chiara.yaml
      title: Studio Chiara
      icon: mdi:bed
      show_in_sidebar: true
      require_admin: false
    walldisplay-camera-1:
      mode: yaml
      filename: dashboards/walldisplay-camera-1.yaml
      title: Camera 1
      icon: mdi:bed
      show_in_sidebar: true
      require_admin: false
    walldisplay-bagno-ospiti:
      mode: yaml
      filename: dashboards/walldisplay-bagno-ospiti.yaml
      title: Bagno Ospiti
      icon: mdi:shower
      show_in_sidebar: true
      require_admin: false
    walldisplay-bagno-camera:
      mode: yaml
      filename: dashboards/walldisplay-bagno-camera.yaml
      title: Bagno Camera
      icon: mdi:shower-head
      show_in_sidebar: true
      require_admin: false
    # Enable this when the climate.ingresso_pt_termostato entity is configured:
