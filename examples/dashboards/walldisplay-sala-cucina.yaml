# Sala & Cucina — Wall Display XL (10.1") — Room Dashboard
#
# Uses the large `cow-room-dashboard-card` (Phase 1 idle + Phase 2 drawer):
#   - Header: chip per room + weather pill + now-playing pill
#   - Hero: clock + ambient weather hero
#   - Scenes: 4 quick shortcut buttons
#   - Drawer (slide-up on chip tap): Lights / Blinds / Climate / Sicurezza
#
# "Sala" and "Cucina" are rendered as a SINGLE room called "Sala & Cucina"
# (open-plan space — no point in having a separate chip for cucina). The
# rest of the rooms each get their own chip.
#
# Ambient temperature/humidity for Sala & Cucina come from the SAWD1
# WallDisplay sensor in salone (MAC D2D2C5 — 21.7°C / 53.4% rH at this
# moment, the only one whose readings make sense for a living room).
# When you map MAC→room officially, swap the entity_id below.
#
# URL on the SAWD-XL:
#   https://<ha-host>/walldisplay-sala-cucina/0?kiosk&block_context_menu&cache

title: Sala & Cucina
views:
  - title: Sala & Cucina
    path: "0"
    type: panel
    cards:
      - type: custom:cow-room-dashboard-card
        # Pirate Weather (HA core integration). Provides the attributes
        # the hero card consumes natively: `temperature`,
        # `apparent_temperature`, `humidity`, `wind_speed` (km/h with
        # `Units = si`). Replaces the previous Met.no `weather.forecast_home`
        # which lacked `apparent_temperature` and had coarser resolution.
        weather_entity: weather.pirateweather
        # Live sky / sun position / moon phases (v0.7.0+).
        sun_entity: sun.sun
        moon_entity: sensor.moon

        # Pollen block (v0.10.0+). Drives both the inline pollen line
        # in the hero ("🌿 alta · graminacee, betulla") and the airborne
        # pollen particle FX layered over the sky.
        #
        # Sensors come from the Polleninformation EU HACS integration
        # (Austrian Pollen Information Service, supports Italy). Levels
        # are 0..4 ("nessuna" / "bassa" / "moderata" / "alta" / "molto alta").
        #
        # `pinned` allergens are always listed in the line even at
        # level 0 — useful for severe personal allergies. `min_level`
        # controls the threshold for un-pinned allergens; 1 = surface
        # anything from "bassa" upward.
        pollen:
          overall: sensor.polleninformation_tavernerio_allergy_risk
          allergens:
            - sensor.polleninformation_tavernerio_grasses
            - sensor.polleninformation_tavernerio_birch
            - sensor.polleninformation_tavernerio_quercia
            - sensor.polleninformation_tavernerio_olive
            - sensor.polleninformation_tavernerio_ragweed
            - sensor.polleninformation_tavernerio_alder
            - sensor.polleninformation_tavernerio_hazel
            - sensor.polleninformation_tavernerio_mugwort
            - sensor.polleninformation_tavernerio_plane_tree
            - sensor.polleninformation_tavernerio_frassino
          min_level: 1   # mostra anche "bassa"
          max_items: 3
          pinned:
            - sensor.polleninformation_tavernerio_grasses   # graminacee
            - sensor.polleninformation_tavernerio_mugwort   # artemisia
        # Music block (v0.8.1+). The speaker is the Shelly Wall Display
        # in the kitchen. Music Assistant routes Spotify content
        # through its stream proxy → the speaker. Radios are searched
        # live from MA's "Radio Browser" provider (~50k stations) and
        # surfaced from the user's MA favorites (heart icon in MA UI) —
        # no URLs hardcoded here on purpose.
        # `media_player.music_assistant` is the universal MA player that
        # always works because MA streams to it natively. Once the Shelly
        # firmware compatibility issue is resolved (Settings → MA →
        # Players → Display Sala → Output protocol = MP3 stream), swap
        # this to `media_player.display_sala_2` so audio actually plays
        # on the Wall Display speaker.
        media_player: media_player.music_assistant
        music_assistant_id: 01KR70XN8WQ46Y3B20BQKHG27P
        # music:
        #   favorite_radios_limit: 6   # default — chips in cinema mode
        locale: it-IT

        rooms:
          # ── Living ───────────────────────────────────────────────────
          - name: Sala & Cucina
            icon: "🛋"
            group: Living
            # Il Display Sala non ha sensore ambient (in arrivo): niente
            # temperature/humidity qui finché non viene installato.
            light:
              - light.led_calda_sala
              - light.led_sala_fredda
              - light.luce_tavolo_sala
              - light.led_corridoio_p1
              - light.luce_cucina
              - light.led_cucina
            light_labels:
              ["Sala calda", "Sala fredda", "Sala tavolo", "Corridoio", "Cucina", "Cucina LED"]
            cover:
              - cover.tapparella_sala
              - cover.tapparella_sala_terrazza
              - cover.tapparella_cucina
              - cover.tapparella_cucina_terrazza
            cover_labels:
              ["Sala", "Sala terrazza", "Cucina", "Cucina terrazza"]

          # ── Zona notte ───────────────────────────────────────────────
          - name: Padronale
            icon: "🛏"
            group: Zona notte
            # Comodini + LED soffitto + LED cabina armadio (la cabina non
            # ha più un chip dedicato: i suoi controlli vivono qui).
            # NOTE: comodino_01/02 sono esposti come light.* via helper
            # "Switch as X" (i device fisici in HA sono switch.*).
            light:
              - light.comodino_01
              - light.comodino_02
              - light.led_camera_3
              - light.led_cabina_armadio
            light_labels: ["Comodino 1", "Comodino 2", "LED", "Cabina"]
            cover: cover.tapparella_camera_padronale

          - name: Studio Chiara
            icon: "🛌"
            group: Zona notte
            light: light.led_camera_2
            cover: cover.tapparella_camera_2

          - name: Camera 1
            icon: "🛌"
            group: Zona notte
            light: light.led_camera_1
            cover: cover.tapparella_camera_1

          # ── Servizi ──────────────────────────────────────────────────
          - name: Bagno P.
            icon: "🚿"
            group: Servizi
            light:
              - light.luce_bagno_padronale
              - light.luce_specchio_bagno_padronale
            light_labels: ["Soffitto", "Specchio"]
            cover: cover.tapparella_bagno_padronale

          - name: Bagno O.
            icon: "🚿"
            group: Servizi
            light:
              - light.led_bagno_piccolo
              - light.luce_specchio_bagno_piccolo
            light_labels: ["Soffitto", "Specchio"]
            cover: cover.tapparella_bagno_piccola

          - name: Lavanderia
            icon: "🧺"
            group: Servizi
            light: light.luce_bagno_pt
            cover: cover.tapparella_bagno_pt

          # ── Altro ────────────────────────────────────────────────────
          - name: Studio
            icon: "💻"
            group: Altro
            light:
              - light.luce_calda_studio
              - light.luce_fredda_studio
            light_labels: ["Calda", "Fredda"]
            cover: cover.tapparella_studio

          - name: Garage
            icon: "🚗"
            group: Altro
            light: light.luce_box

          - name: Ingresso PT
            icon: "🚪"
            group: Altro
            light:
              - light.luce_scala
              - light.sgabuzzino_pt
            light_labels: ["Scala", "Sgabuzzino"]

          - name: Esterno
            icon: "🌳"
            group: Altro
            light:
              - light.led_terrazzo
              - light.led_esterno_p1
              - light.luce_esterna_studio
            light_labels: ["Terrazzo", "Esterno P1", "Studio"]

        scenes:
          - name: Tutto OFF
            icon: "○"
            accent: "#8C8C99"
            service: script.cow_tutto_off
          - name: Apri tutto
            icon: "△"
            accent: "#26A673"
            service: script.cow_apri_tutto
          - name: Notte
            icon: "☾"
            accent: "#1F1F2E"
            service: script.cow_notte
          - name: Cinema
            icon: "■"
            accent: "#FA6B2E"
            service: script.cow_cinema
