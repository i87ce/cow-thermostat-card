# Ingresso PT — Wall Display 4" (SAWD1 @ 172.16.2.15)
#
# Live HA slug: walldisplay-scala
# URL: https://<ha-host>/walldisplay-scala/0?kiosk&block_context_menu&cache

title: Ingresso PT
views:
  - title: Ingresso PT
    path: "0"
    type: panel
    cards:
      - type: custom:cow-thermostat-card
        room: "Ingresso PT"
        climate: climate.casa_ingresso_pt
        local_temp: sensor.display_ingresso_pt_temperature
        local_humidity: sensor.display_ingresso_pt_humidity
        outdoor_temp: sensor.koolnova_temperatura_esterna
        initial_view: thermostat
        areas:
          - Ingresso PT
        opening_default_kind: window
        lights:
          - entity: light.luce_scala
            label: Scala
          - entity: light.sgabuzzino_pt
            label: Sgabuzzino
        hidden_studio_door: true
        studio_door_entity: button.studio_unlock
        studio_door_lights:
          - light.luce_calda_studio
          - light.luce_fredda_studio
