# Sala — Wall Display dashboard
#
# Drop this file into <ha-config>/dashboards/walldisplay-living.yaml and
# register it in configuration.yaml (see examples/configuration-snippet.yaml).
#
# Replace <MAC> with the actual MAC of the Wall Display you mounted in this
# room — pick one from the list returned by HA's Shelly integration, e.g.
# 000822097825. The temp/humidity sensor entity_ids follow the pattern
# sensor.shellywalldisplay_<mac>_temperature / _humidity.
#
# Open URL on the Shelly Wall Display:
#   https://<ha-host>/walldisplay-living/0?kiosk&block_context_menu&cache

title: Sala Wall Display
views:
  - title: Sala
    path: 0
    type: panel
    cards:
      - type: custom:cow-thermostat-card
        room: "Sala"
        # climate: climate.sala_termostato            # add when configured
        # Sala has 3 lights — pick one (or build a light group in HA first):
        light: light.led_sala_calda
        # Sala has 2 covers — pick one (or build a cover group in HA first):
        cover: cover.tapparella_sala
        # local_temp:     sensor.shellywalldisplay_<MAC>_temperature
        # local_humidity: sensor.shellywalldisplay_<MAC>_humidity
        # outdoor_temp:   sensor.weather_temperature   # add when a weather entity is exposed
        initial_view: lights
