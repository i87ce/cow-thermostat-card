# Sala — Wall Display dashboard
#
# Drop into <ha-config>/dashboards/walldisplay-living.yaml.
# Open URL on the Shelly Wall Display:
#   https://<ha-host>/walldisplay-living/0?kiosk&block_context_menu&cache

title: Sala
views:
  - title: Sala
    path: "0"
    type: panel
    cards:
      - type: custom:cow-thermostat-card
        room: "Sala"
        light:
          - light.led_calda_sala
          - light.led_sala_fredda
          - light.luce_tavolo_sala
        light_labels: ["Calda", "Fredda", "Tavolo"]
        cover:
          - cover.tapparella_sala
          - cover.tapparella_sala_terrazza
        cover_labels: ["Sala", "Terrazza"]
        # local_temp:     sensor.shellywalldisplay_<MAC>_temperature
        # local_humidity: sensor.shellywalldisplay_<MAC>_humidity
        initial_view: lights
