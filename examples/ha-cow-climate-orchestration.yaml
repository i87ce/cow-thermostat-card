# ---------------------------------------------------------------------------
# Cow Climate orchestration — Mitsubishi + serrande ESP32 + pavimento
# ---------------------------------------------------------------------------
# Drop into /config/packages/cow_climate.yaml (packages: !include_dir_named packages).
# Design: docs/06-house-hvac-architecture.md §F-bis (Mitsubishi v3).
#
# REGOLA 1: Mitsubishi acceso ⇒ almeno 1 serranda aperta. Mai violare.
#
# Entities:
#   climate.casa_aria          — global mode + fan (all displays)
#   climate.casa_<room>        — per-room setpoint + air on/off (heat = aria on)
#   climate.koolnova_clima_clim1 — Mitsubishi physical
#   cover.koolnova_serrande_serranda_1..5 — dampers (auto only)
# ---------------------------------------------------------------------------

mqtt:
  climate:
    # ── Global system (mode + fan — same on every display) ─────────────
    - name: "Casa Aria"
      unique_id: casa_aria
      modes: ["off", "heat", "cool", "dry", "fan_only"]
      fan_modes: ["auto", "low", "medium", "high"]
      min_temp: 16
      max_temp: 30
      temp_step: 1
      retain: true
      optimistic: true
      mode_command_topic: "cow/casa/aria/mode/set"
      mode_state_topic: "cow/casa/aria/mode/state"
      temperature_command_topic: "cow/casa/aria/setpoint/set"
      temperature_state_topic: "cow/casa/aria/setpoint/state"
      fan_mode_command_topic: "cow/casa/aria/fan/set"
      fan_mode_state_topic: "cow/casa/aria/fan/state"
      current_temperature_topic: "cow/casa/aria/current/state"
      action_topic: "cow/casa/aria/action/state"

    # ── Per-room proxies (setpoint + air participation) ───────────────
    # Air zones: modes off/heat only — heat = stanza partecipa al loop aria.
    # Floor-only: off/heat controls pavimento directly.
    - name: "Casa Sala & Cucina"
      unique_id: casa_sala_cucina
      modes: ["off", "heat"]
      min_temp: 15
      max_temp: 30
      temp_step: 0.5
      retain: true
      optimistic: true
      mode_command_topic: "cow/casa/sala_cucina/mode/set"
      mode_state_topic: "cow/casa/sala_cucina/mode/state"
      temperature_command_topic: "cow/casa/sala_cucina/setpoint/set"
      temperature_state_topic: "cow/casa/sala_cucina/setpoint/state"
      current_temperature_topic: "cow/casa/sala_cucina/current/state"
      current_humidity_topic: "cow/casa/sala_cucina/humidity/state"
      action_topic: "cow/casa/sala_cucina/action/state"

    - name: "Casa Camera"
      unique_id: casa_camera
      modes: ["off", "heat"]
      min_temp: 15
      max_temp: 30
      temp_step: 0.5
      retain: true
      optimistic: true
      mode_command_topic: "cow/casa/camera/mode/set"
      mode_state_topic: "cow/casa/camera/mode/state"
      temperature_command_topic: "cow/casa/camera/setpoint/set"
      temperature_state_topic: "cow/casa/camera/setpoint/state"
      current_temperature_topic: "cow/casa/camera/current/state"
      current_humidity_topic: "cow/casa/camera/humidity/state"
      action_topic: "cow/casa/camera/action/state"

    - name: "Casa Studio Chiara"
      unique_id: casa_studio_chiara
      modes: ["off", "heat"]
      min_temp: 15
      max_temp: 30
      temp_step: 0.5
      retain: true
      optimistic: true
      mode_command_topic: "cow/casa/studio_chiara/mode/set"
      mode_state_topic: "cow/casa/studio_chiara/mode/state"
      temperature_command_topic: "cow/casa/studio_chiara/setpoint/set"
      temperature_state_topic: "cow/casa/studio_chiara/setpoint/state"
      current_temperature_topic: "cow/casa/studio_chiara/current/state"
      current_humidity_topic: "cow/casa/studio_chiara/humidity/state"
      action_topic: "cow/casa/studio_chiara/action/state"

    - name: "Casa Camera Padronale"
      unique_id: casa_camera_padronale
      modes: ["off", "heat"]
      min_temp: 15
      max_temp: 30
      temp_step: 0.5
      retain: true
      optimistic: true
      mode_command_topic: "cow/casa/camera_padronale/mode/set"
      mode_state_topic: "cow/casa/camera_padronale/mode/state"
      temperature_command_topic: "cow/casa/camera_padronale/setpoint/set"
      temperature_state_topic: "cow/casa/camera_padronale/setpoint/state"
      current_temperature_topic: "cow/casa/camera_padronale/current/state"
      current_humidity_topic: "cow/casa/camera_padronale/humidity/state"
      action_topic: "cow/casa/camera_padronale/action/state"

    - name: "Casa Ingresso PT"
      unique_id: casa_ingresso_pt
      modes: ["off", "heat"]
      min_temp: 15
      max_temp: 30
      temp_step: 0.5
      retain: true
      optimistic: true
      mode_command_topic: "cow/casa/ingresso_pt/mode/set"
      mode_state_topic: "cow/casa/ingresso_pt/mode/state"
      temperature_command_topic: "cow/casa/ingresso_pt/setpoint/set"
      temperature_state_topic: "cow/casa/ingresso_pt/setpoint/state"
      current_temperature_topic: "cow/casa/ingresso_pt/current/state"
      current_humidity_topic: "cow/casa/ingresso_pt/humidity/state"
      action_topic: "cow/casa/ingresso_pt/action/state"

    - name: "Casa Bagno Padronale"
      unique_id: casa_bagno_padronale
      modes: ["off", "heat"]
      min_temp: 15
      max_temp: 30
      temp_step: 0.5
      retain: true
      optimistic: true
      mode_command_topic: "cow/casa/bagno_padronale/mode/set"
      mode_state_topic: "cow/casa/bagno_padronale/mode/state"
      temperature_command_topic: "cow/casa/bagno_padronale/setpoint/set"
      temperature_state_topic: "cow/casa/bagno_padronale/setpoint/state"
      current_temperature_topic: "cow/casa/bagno_padronale/current/state"
      current_humidity_topic: "cow/casa/bagno_padronale/humidity/state"
      action_topic: "cow/casa/bagno_padronale/action/state"

    - name: "Casa Bagno Ospiti"
      unique_id: casa_bagno_ospiti
      modes: ["off", "heat"]
      min_temp: 15
      max_temp: 30
      temp_step: 0.5
      retain: true
      optimistic: true
      mode_command_topic: "cow/casa/bagno_ospiti/mode/set"
      mode_state_topic: "cow/casa/bagno_ospiti/mode/state"
      temperature_command_topic: "cow/casa/bagno_ospiti/setpoint/set"
      temperature_state_topic: "cow/casa/bagno_ospiti/setpoint/state"
      current_temperature_topic: "cow/casa/bagno_ospiti/current/state"
      current_humidity_topic: "cow/casa/bagno_ospiti/humidity/state"
      action_topic: "cow/casa/bagno_ospiti/action/state"

script:
  cow_climate_open_serranda:
    alias: "Cow Climate — Open one serranda"
    mode: parallel
    fields:
      entity:
        selector:
          entity:
            domain: cover
    sequence:
      - service: cover.open_cover
        target:
          entity_id: "{{ entity }}"

  cow_climate_close_serranda:
    alias: "Cow Climate — Close one serranda (REGOLA 1 guard)"
    mode: parallel
    fields:
      entity:
        selector:
          entity:
            domain: cover
    sequence:
      - variables:
          all_serrande:
            - cover.koolnova_serrande_serranda_1
            - cover.koolnova_serrande_serranda_2
            - cover.koolnova_serrande_serranda_3
            - cover.koolnova_serrande_serranda_4
            - cover.koolnova_serrande_serranda_5
          mitsu: climate.koolnova_clima_clim1
          open_count: >-
            {% set ns = namespace(n=0) %}
            {% for s in all_serrande %}
              {% if is_state(s, 'open') or (state_attr(s, 'current_position') | int(0)) > 0 %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.n }}
          would_close: >-
            {{ is_state(entity, 'open') or (state_attr(entity, 'current_position') | int(0)) > 0 }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not would_close }}"
            sequence: []
          - conditions:
              - condition: template
                value_template: "{{ is_state(mitsu, 'off') }}"
            sequence:
              - service: cover.close_cover
                target:
                  entity_id: "{{ entity }}"
          - conditions:
              - condition: template
                value_template: "{{ open_count | int > 1 }}"
            sequence:
              - service: cover.close_cover
                target:
                  entity_id: "{{ entity }}"

  cow_climate_sync_air:
    alias: "Cow Climate — Sync Mitsubishi + serrande"
    mode: restart
    sequence:
      - variables:
          aria_mode: "{{ states('climate.casa_aria') }}"
          aria_fan: "{{ state_attr('climate.casa_aria', 'fan_mode') or 'auto' }}"
          mitsu: climate.koolnova_clima_clim1
          TOL: 1.0
          HEAT_T: 30
          COOL_T: 16
          all_serrande:
            - cover.koolnova_serrande_serranda_1
            - cover.koolnova_serrande_serranda_2
            - cover.koolnova_serrande_serranda_3
            - cover.koolnova_serrande_serranda_4
            - cover.koolnova_serrande_serranda_5
          fan_map:
            auto: auto
            low: low
            medium: medium
            high: high
            middle: medium
            quiet: low
          mitsu_fan: "{{ fan_map.get(aria_fan, 'auto') }}"
          air_zones:
            - slug: camera_padronale
              proxy: climate.casa_camera_padronale
              temp: sensor.display_camera_padronale_temperature
              serrande:
                - cover.koolnova_serrande_serranda_1
            - slug: studio_chiara
              proxy: climate.casa_studio_chiara
              temp: sensor.display_camera_2_temperature
              serrande:
                - cover.koolnova_serrande_serranda_2
            - slug: camera
              proxy: climate.casa_camera
              temp: sensor.display_camera_1_temperature
              serrande:
                - cover.koolnova_serrande_serranda_3
            - slug: sala_cucina
              proxy: climate.casa_sala_cucina
              temp: sensor.display_sala_temperature
              serrande:
                - cover.koolnova_serrande_serranda_4
                - cover.koolnova_serrande_serranda_5
          deficit_serrande: >-
            {% set TOL = 1.0 %}
            {% set aria = states('climate.casa_aria') %}
            {% set zones = [
              {'proxy':'climate.casa_camera_padronale','temp':'sensor.display_camera_padronale_temperature','serrande':['cover.koolnova_serrande_serranda_1']},
              {'proxy':'climate.casa_studio_chiara','temp':'sensor.display_camera_2_temperature','serrande':['cover.koolnova_serrande_serranda_2']},
              {'proxy':'climate.casa_camera','temp':'sensor.display_camera_1_temperature','serrande':['cover.koolnova_serrande_serranda_3']},
              {'proxy':'climate.casa_sala_cucina','temp':'sensor.display_sala_temperature','serrande':['cover.koolnova_serrande_serranda_4','cover.koolnova_serrande_serranda_5']}
            ] %}
            {% set ns = namespace(out=[]) %}
            {% if aria not in ['off','unknown','unavailable','none', None] %}
            {% for z in zones %}
              {% if states(z.proxy) == 'heat' %}
                {% set sp = state_attr(z.proxy, 'temperature') | float(20) %}
                {% set cur = states(z.temp) | float(20) %}
                {% set deficit = (aria == 'heat' and cur < sp - TOL)
                   or (aria in ['cool','dry'] and cur > sp + TOL)
                   or aria == 'fan_only' %}
                {% if deficit %}
                  {% for s in z.serrande %}
                    {% set ns.out = ns.out + [s] %}
                  {% endfor %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% endif %}
            {{ ns.out | unique | join(',') }}
          at_setpoint_serrande: >-
            {% set TOL = 1.0 %}
            {% set aria = states('climate.casa_aria') %}
            {% set zones = [
              {'proxy':'climate.casa_camera_padronale','temp':'sensor.display_camera_padronale_temperature','serrande':['cover.koolnova_serrande_serranda_1']},
              {'proxy':'climate.casa_studio_chiara','temp':'sensor.display_camera_2_temperature','serrande':['cover.koolnova_serrande_serranda_2']},
              {'proxy':'climate.casa_camera','temp':'sensor.display_camera_1_temperature','serrande':['cover.koolnova_serrande_serranda_3']},
              {'proxy':'climate.casa_sala_cucina','temp':'sensor.display_sala_temperature','serrande':['cover.koolnova_serrande_serranda_4','cover.koolnova_serrande_serranda_5']}
            ] %}
            {% set ns = namespace(out=[]) %}
            {% if aria not in ['off','unknown','unavailable','none', None] %}
            {% for z in zones %}
              {% if states(z.proxy) == 'heat' %}
                {% set sp = state_attr(z.proxy, 'temperature') | float(20) %}
                {% set cur = states(z.temp) | float(20) %}
                {% set at = cur >= sp - TOL and cur <= sp + TOL %}
                {% if at %}
                  {% for s in z.serrande %}
                    {% set ns.out = ns.out + [s] %}
                  {% endfor %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% endif %}
            {{ ns.out | unique | join(',') }}
          active_air_count: >-
            {% set ns = namespace(n=0) %}
            {% set zones = ['climate.casa_camera_padronale','climate.casa_studio_chiara','climate.casa_camera','climate.casa_sala_cucina'] %}
            {% for p in zones %}
              {% if states(p) == 'heat' %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.n }}
          excluded_serrande: >-
            {% set zones = [
              {'proxy':'climate.casa_camera_padronale','serrande':['cover.koolnova_serrande_serranda_1']},
              {'proxy':'climate.casa_studio_chiara','serrande':['cover.koolnova_serrande_serranda_2']},
              {'proxy':'climate.casa_camera','serrande':['cover.koolnova_serrande_serranda_3']},
              {'proxy':'climate.casa_sala_cucina','serrande':['cover.koolnova_serrande_serranda_4','cover.koolnova_serrande_serranda_5']}
            ] %}
            {% set ns = namespace(out=[]) %}
            {% for z in zones %}
              {% if states(z.proxy) != 'heat' %}
                {% for s in z.serrande %}
                  {% set ns.out = ns.out + [s] %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.out | unique | join(',') }}
          all_at_setpoint: >-
            {% set ac = active_air_count | int %}
            {% set at = at_setpoint_serrande | trim %}
            {% if ac == 0 %}false
            {% elif aria_mode == 'fan_only' %}true
            {% else %}
              {% set at_list = at.split(',') if at else [] %}
              {% set need = ac * 1 %}
              {{ at_list | length >= ac and deficit_serrande | trim == '' }}
            {% endif %}

      # ── OFF: Mitsubishi first, then close all serrande (REGOLA 1) ───
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ aria_mode in ['off', 'unknown', 'unavailable', 'none'] or aria_mode is none }}"
            sequence:
              - service: climate.set_hvac_mode
                target:
                  entity_id: "{{ mitsu }}"
                data:
                  hvac_mode: "off"
              - service: cover.close_cover
                target:
                  entity_id: "{{ all_serrande }}"
        default:
          - choose:
              # ── fan_only global OR all zones at setpoint ──────
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ aria_mode == 'fan_only' or all_at_setpoint | bool }}
                sequence:
                  - service: cover.open_cover
                    target:
                      entity_id: "{{ all_serrande }}"
                  - delay:
                      seconds: 2
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: "{{ mitsu }}"
                    data:
                      hvac_mode: "fan_only"
                  - service: climate.set_fan_mode
                    target:
                      entity_id: "{{ mitsu }}"
                    data:
                      fan_mode: "{{ mitsu_fan }}"
              # ── No active air zones ───────────────────────────
              - conditions:
                  - condition: template
                    value_template: "{{ active_air_count | int == 0 }}"
                sequence:
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: "{{ mitsu }}"
                    data:
                      hvac_mode: "off"
                  - service: cover.close_cover
                    target:
                      entity_id: "{{ all_serrande }}"
              # ── Conditioning: deficit zones ─────────────────────
              - conditions:
                  - condition: template
                    value_template: "{{ deficit_serrande | trim != '' }}"
                sequence:
                  - repeat:
                      for_each: "{{ deficit_serrande.split(',') if deficit_serrande | trim else [] }}"
                      sequence:
                        - service: script.cow_climate_open_serranda
                          data:
                            entity: "{{ repeat.item | trim }}"
                  - delay:
                      seconds: 2
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ aria_mode == 'heat' }}"
                        sequence:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ mitsu }}"
                            data:
                              hvac_mode: "heat"
                          - service: climate.set_temperature
                            target:
                              entity_id: "{{ mitsu }}"
                            data:
                              temperature: "{{ HEAT_T }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ aria_mode == 'cool' }}"
                        sequence:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ mitsu }}"
                            data:
                              hvac_mode: "cool"
                          - service: climate.set_temperature
                            target:
                              entity_id: "{{ mitsu }}"
                            data:
                              temperature: "{{ COOL_T }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ aria_mode == 'dry' }}"
                        sequence:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ mitsu }}"
                            data:
                              hvac_mode: "dry"
                          - service: climate.set_temperature
                            target:
                              entity_id: "{{ mitsu }}"
                            data:
                              temperature: "{{ COOL_T }}"
                  - service: climate.set_fan_mode
                    target:
                      entity_id: "{{ mitsu }}"
                    data:
                      fan_mode: "{{ mitsu_fan }}"
                  - repeat:
                      for_each: "{{ at_setpoint_serrande.split(',') if at_setpoint_serrande | trim else [] }}"
                      sequence:
                        - service: script.cow_climate_close_serranda
                          data:
                            entity: "{{ repeat.item | trim }}"
              # ── Fallback: fan circulate ───────────────────────
            default:
              - service: cover.open_cover
                target:
                  entity_id: "{{ all_serrande }}"
              - delay:
                  seconds: 2
              - service: climate.set_hvac_mode
                target:
                  entity_id: "{{ mitsu }}"
                data:
                  hvac_mode: "fan_only"
              - service: climate.set_fan_mode
                target:
                  entity_id: "{{ mitsu }}"
                data:
                  fan_mode: "{{ mitsu_fan }}"

      # Stanze con Aria Off: chiudi le loro serrande (REGOLA 1 guard in script).
      - repeat:
          for_each: "{{ excluded_serrande.split(',') if excluded_serrande | trim else [] }}"
          sequence:
            - service: script.cow_climate_close_serranda
              data:
                entity: "{{ repeat.item | trim }}"

      # Mirror fixed temps on casa_aria proxy for UI readback
      - service: mqtt.publish
        data:
          topic: cow/casa/aria/setpoint/state
          payload: >-
            {% if aria_mode == 'heat' %}30{% elif aria_mode in ['cool','dry'] %}16{% else %}0{% endif %}
          retain: true

automation:
  - id: cow_climate_publish_current_temp
    alias: "Cow Climate — Publish current temperatures to MQTT"
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id:
          - sensor.display_sala_temperature
          - sensor.display_camera_1_temperature
          - sensor.display_camera_2_temperature
          - sensor.display_camera_padronale_temperature
          - sensor.display_ingresso_pt_temperature
          - sensor.display_bagno_padronale_temperature
          - sensor.display_bagno_ospiti_temperature
          - climate.koolnova_clima_clim1
    variables:
      topic_by_sensor:
        sensor.display_sala_temperature: "cow/casa/sala_cucina/current/state"
        sensor.display_camera_1_temperature: "cow/casa/camera/current/state"
        sensor.display_camera_2_temperature: "cow/casa/studio_chiara/current/state"
        sensor.display_camera_padronale_temperature: "cow/casa/camera_padronale/current/state"
        sensor.display_ingresso_pt_temperature: "cow/casa/ingresso_pt/current/state"
        sensor.display_bagno_padronale_temperature: "cow/casa/bagno_padronale/current/state"
        sensor.display_bagno_ospiti_temperature: "cow/casa/bagno_ospiti/current/state"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.entity_id == 'climate.koolnova_clima_clim1' }}"
            sequence:
              - condition: template
                value_template: "{{ state_attr('climate.koolnova_clima_clim1', 'current_temperature') is number }}"
              - service: mqtt.publish
                data:
                  topic: cow/casa/aria/current/state
                  payload: "{{ state_attr('climate.koolnova_clima_clim1', 'current_temperature') }}"
                  retain: true
        default:
          - condition: template
            value_template: "{{ trigger.to_state.state not in ['unknown','unavailable','none', None] }}"
          - service: mqtt.publish
            data:
              topic: "{{ topic_by_sensor[trigger.entity_id] }}"
              payload: "{{ trigger.to_state.state }}"
              retain: true

  - id: cow_climate_publish_current_humidity
    alias: "Cow Climate — Publish current humidity to MQTT"
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id:
          - sensor.display_sala_humidity
          - sensor.display_camera_1_humidity
          - sensor.display_camera_2_humidity
          - sensor.display_camera_padronale_humidity
          - sensor.display_ingresso_pt_humidity
          - sensor.display_bagno_padronale_humidity
          - sensor.display_bagno_ospiti_humidity
    variables:
      topic_by_sensor:
        sensor.display_sala_humidity: "cow/casa/sala_cucina/humidity/state"
        sensor.display_camera_1_humidity: "cow/casa/camera/humidity/state"
        sensor.display_camera_2_humidity: "cow/casa/studio_chiara/humidity/state"
        sensor.display_camera_padronale_humidity: "cow/casa/camera_padronale/humidity/state"
        sensor.display_ingresso_pt_humidity: "cow/casa/ingresso_pt/humidity/state"
        sensor.display_bagno_padronale_humidity: "cow/casa/bagno_padronale/humidity/state"
        sensor.display_bagno_ospiti_humidity: "cow/casa/bagno_ospiti/humidity/state"
    action:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown','unavailable','none', None] }}"
      - service: mqtt.publish
        data:
          topic: "{{ topic_by_sensor[trigger.entity_id] }}"
          payload: "{{ trigger.to_state.state }}"
          retain: true

  - id: cow_climate_publish_state_echo
    alias: "Cow Climate — Echo proxy commands to retained state topics"
    mode: queued
    max: 30
    trigger:
      - platform: mqtt
        topic: "cow/casa/+/mode/set"
      - platform: mqtt
        topic: "cow/casa/+/setpoint/set"
      - platform: mqtt
        topic: "cow/casa/+/fan/set"
    action:
      - service: mqtt.publish
        data:
          topic: "{{ trigger.topic | regex_replace(find='/set$', replace='/state') }}"
          payload: "{{ trigger.payload }}"
          retain: true

  - id: cow_climate_trigger_sync_air
    alias: "Cow Climate — Trigger Mitsubishi sync"
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - climate.casa_aria
          - climate.casa_sala_cucina
          - climate.casa_camera
          - climate.casa_studio_chiara
          - climate.casa_camera_padronale
      - platform: state
        entity_id:
          - sensor.display_sala_temperature
          - sensor.display_camera_1_temperature
          - sensor.display_camera_2_temperature
          - sensor.display_camera_padronale_temperature
    action:
      - service: script.cow_climate_sync_air

  - id: cow_climate_orchestrator_floor
    alias: "Cow Climate — Pavimento sync"
    description: "Floor heating per room; air rooms follow casa_aria heat."
    mode: queued
    max: 20
    trigger:
      - platform: state
        entity_id:
          - climate.casa_aria
          - climate.casa_sala_cucina
          - climate.casa_camera
          - climate.casa_studio_chiara
          - climate.casa_camera_padronale
          - climate.casa_ingresso_pt
          - climate.casa_bagno_padronale
          - climate.casa_bagno_ospiti
      - platform: state
        entity_id:
          - sensor.display_sala_temperature
          - sensor.display_camera_1_temperature
          - sensor.display_camera_2_temperature
          - sensor.display_camera_padronale_temperature
          - sensor.display_ingresso_pt_temperature
          - sensor.display_bagno_padronale_temperature
          - sensor.display_bagno_ospiti_temperature
    variables:
      proxy_to_slug:
        climate.casa_sala_cucina: sala_cucina
        climate.casa_camera: camera
        climate.casa_studio_chiara: studio_chiara
        climate.casa_camera_padronale: camera_padronale
        climate.casa_ingresso_pt: ingresso_pt
        climate.casa_bagno_padronale: bagno_padronale
        climate.casa_bagno_ospiti: bagno_ospiti
      temp_to_slug:
        sensor.display_sala_temperature: sala_cucina
        sensor.display_camera_1_temperature: camera
        sensor.display_camera_2_temperature: studio_chiara
        sensor.display_camera_padronale_temperature: camera_padronale
        sensor.display_ingresso_pt_temperature: ingresso_pt
        sensor.display_bagno_padronale_temperature: bagno_padronale
        sensor.display_bagno_ospiti_temperature: bagno_ospiti
      rooms:
        sala_cucina:
          proxy: climate.casa_sala_cucina
          pavimento: climate.display_sala_pavimento_sala_cucina
          floor_only: false
        camera:
          proxy: climate.casa_camera
          pavimento: climate.display_camera_1_pavimento_camera_1
          floor_only: false
        studio_chiara:
          proxy: climate.casa_studio_chiara
          pavimento: climate.pavimento_camera_2
          floor_only: false
        camera_padronale:
          proxy: climate.casa_camera_padronale
          pavimento: climate.display_camera_padronale_pavimento_camera_padronale
          floor_only: false
        ingresso_pt:
          proxy: climate.casa_ingresso_pt
          pavimento: climate.pavimento_ingresso_pt
          floor_only: true
        bagno_padronale:
          proxy: climate.casa_bagno_padronale
          pavimento: climate.pavimento_bagno_padronale
          floor_only: true
        bagno_ospiti:
          proxy: climate.casa_bagno_ospiti
          pavimento: climate.display_bagno_ospiti_pavimento_bagno_ospiti
          floor_only: true
      slug: >-
        {% if trigger.entity_id in proxy_to_slug %}
          {{ proxy_to_slug[trigger.entity_id] }}
        {% elif trigger.entity_id in temp_to_slug %}
          {{ temp_to_slug[trigger.entity_id] }}
        {% elif trigger.entity_id == 'climate.casa_aria' %}
          all
        {% else %}
          {{ '' }}
        {% endif %}
      FLOOR_OFFSET: 1.0
      aria_mode: "{{ states('climate.casa_aria') }}"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ slug | trim == 'all' }}"
            sequence:
              - repeat:
                  for_each:
                    - sala_cucina
                    - camera
                    - studio_chiara
                    - camera_padronale
                    - ingresso_pt
                    - bagno_padronale
                    - bagno_ospiti
                  sequence:
                    - variables:
                        rs: "{{ rooms[repeat.item] }}"
                        room_mode: "{{ states(rs.proxy) }}"
                        setpoint: "{{ state_attr(rs.proxy, 'temperature') | float(20) }}"
                        want_heat: >-
                          {% if rs.floor_only %}
                            {{ room_mode == 'heat' }}
                          {% else %}
                            {{ aria_mode == 'heat' }}
                          {% endif %}
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ want_heat | bool }}"
                          sequence:
                            - service: climate.set_hvac_mode
                              target:
                                entity_id: "{{ rs.pavimento }}"
                              data:
                                hvac_mode: "heat"
                            - service: climate.set_temperature
                              target:
                                entity_id: "{{ rs.pavimento }}"
                              data:
                                temperature: "{{ setpoint - FLOOR_OFFSET }}"
                      default:
                        - service: climate.set_hvac_mode
                          target:
                            entity_id: "{{ rs.pavimento }}"
                          data:
                            hvac_mode: "off"
          - conditions:
              - condition: template
                value_template: "{{ (slug | trim) != '' and slug | trim != 'all' }}"
            sequence:
              - variables:
                  r: "{{ rooms[slug | trim] }}"
                  room_mode: "{{ states(r.proxy) }}"
                  setpoint: "{{ state_attr(r.proxy, 'temperature') | float(20) }}"
                  want_heat: >-
                    {% if r.floor_only %}
                      {{ room_mode == 'heat' }}
                    {% else %}
                      {{ aria_mode == 'heat' }}
                    {% endif %}
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ want_heat | bool }}"
                    sequence:
                      - service: climate.set_hvac_mode
                        target:
                          entity_id: "{{ r.pavimento }}"
                        data:
                          hvac_mode: "heat"
                      - service: climate.set_temperature
                        target:
                          entity_id: "{{ r.pavimento }}"
                        data:
                          temperature: "{{ setpoint - FLOOR_OFFSET }}"
                default:
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: "{{ r.pavimento }}"
                    data:
                      hvac_mode: "off"

  - id: cow_climate_safety_damper_open
    alias: "Cow Climate — REGOLA 1 watchdog"
    description: "Mitsubishi on with zero open serrande → open all + fan_only + alert."
    mode: single
    trigger:
      - platform: time_pattern
        seconds: "/30"
      - platform: state
        entity_id:
          - climate.koolnova_clima_clim1
          - cover.koolnova_serrande_serranda_1
          - cover.koolnova_serrande_serranda_2
          - cover.koolnova_serrande_serranda_3
          - cover.koolnova_serrande_serranda_4
          - cover.koolnova_serrande_serranda_5
    variables:
      all_serrande:
        - cover.koolnova_serrande_serranda_1
        - cover.koolnova_serrande_serranda_2
        - cover.koolnova_serrande_serranda_3
        - cover.koolnova_serrande_serranda_4
        - cover.koolnova_serrande_serranda_5
      open_count: >-
        {% set ns = namespace(n=0) %}
        {% for s in all_serrande %}
          {% if is_state(s, 'open') or (state_attr(s, 'current_position') | int(0)) > 0 %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.n }}
    condition:
      - condition: template
        value_template: "{{ not is_state('climate.koolnova_clima_clim1', 'off') }}"
      - condition: template
        value_template: "{{ open_count | int == 0 }}"
    action:
      - service: cover.open_cover
        target:
          entity_id: "{{ all_serrande }}"
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.koolnova_clima_clim1
        data:
          hvac_mode: "fan_only"
      - service: persistent_notification.create
        data:
          title: "Cow Climate — REGOLA 1"
          message: "Mitsubishi acceso senza serrande aperte: recovery automatica (tutte aperte + fan_only)."

  - id: cow_climate_publish_action
    alias: "Cow Climate — Publish hvac_action to MQTT proxies"
    mode: queued
    max: 50
    trigger:
      - platform: state
        entity_id:
          - switch.display_sala
          - switch.display_camera_1
          - switch.display_camera_2
          - switch.display_camera_padronale
          - switch.display_ingresso_pt
          - switch.display_bagno_padronale
          - switch.display_bagno_ospiti
          - climate.koolnova_clima_clim1
          - climate.casa_aria
          - cover.koolnova_serrande_serranda_1
          - cover.koolnova_serrande_serranda_2
          - cover.koolnova_serrande_serranda_3
          - cover.koolnova_serrande_serranda_4
          - cover.koolnova_serrande_serranda_5
          - climate.casa_sala_cucina
          - climate.casa_camera
          - climate.casa_studio_chiara
          - climate.casa_camera_padronale
          - climate.casa_ingresso_pt
          - climate.casa_bagno_padronale
          - climate.casa_bagno_ospiti
      - platform: homeassistant
        event: start
    variables:
      aria_mode: "{{ states('climate.casa_aria') }}"
      mitsu_mode: "{{ states('climate.koolnova_clima_clim1') }}"
      TOL: 1.0
      rooms:
        - slug: sala_cucina
          proxy: climate.casa_sala_cucina
          temp: sensor.display_sala_temperature
          serrande:
            - cover.koolnova_serrande_serranda_4
            - cover.koolnova_serrande_serranda_5
          pavimento_switch: switch.display_sala
          floor_only: false
        - slug: camera
          proxy: climate.casa_camera
          temp: sensor.display_camera_1_temperature
          serrande:
            - cover.koolnova_serrande_serranda_3
          pavimento_switch: switch.display_camera_1
          floor_only: false
        - slug: studio_chiara
          proxy: climate.casa_studio_chiara
          temp: sensor.display_camera_2_temperature
          serrande:
            - cover.koolnova_serrande_serranda_2
          pavimento_switch: switch.display_camera_2
          floor_only: false
        - slug: camera_padronale
          proxy: climate.casa_camera_padronale
          temp: sensor.display_camera_padronale_temperature
          serrande:
            - cover.koolnova_serrande_serranda_1
          pavimento_switch: switch.display_camera_padronale
          floor_only: false
        - slug: ingresso_pt
          proxy: climate.casa_ingresso_pt
          temp: sensor.display_ingresso_pt_temperature
          serrande: []
          pavimento_switch: switch.display_ingresso_pt
          floor_only: true
        - slug: bagno_padronale
          proxy: climate.casa_bagno_padronale
          temp: sensor.display_bagno_padronale_temperature
          serrande: []
          pavimento_switch: switch.display_bagno_padronale
          floor_only: true
        - slug: bagno_ospiti
          proxy: climate.casa_bagno_ospiti
          temp: sensor.display_bagno_ospiti_temperature
          serrande: []
          pavimento_switch: switch.display_bagno_ospiti
          floor_only: true
    action:
      - repeat:
          for_each: "{{ rooms }}"
          sequence:
            - variables:
                r: "{{ repeat.item }}"
                proxy_mode: "{{ states(r.proxy) }}"
                floor_on: "{{ is_state(r.pavimento_switch, 'on') }}"
                air_on: "{{ not r.floor_only and proxy_mode == 'heat' }}"
                sp: "{{ state_attr(r.proxy, 'temperature') | float(20) }}"
                cur: "{{ states(r.temp) | float(20) }}"
                serranda_open: >-
                  {% if r.serrande | length == 0 %}false
                  {% else %}
                  {% set ns = namespace(any=false) %}
                  {% for s in r.serrande %}
                    {% if is_state(s, 'open') or (state_attr(s, 'current_position') | int(0)) > 0 %}
                      {% set ns.any = true %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.any }}
                  {% endif %}
                in_deficit: >-
                  {% if not (air_on | bool) or aria_mode in ['off','unknown','unavailable'] %}false
                  {% elif aria_mode == 'heat' %}{{ cur < sp - TOL }}
                  {% elif aria_mode in ['cool','dry'] %}{{ cur > sp + TOL }}
                  {% elif aria_mode == 'fan_only' %}false
                  {% elif mitsu_mode in ['heat','cool','dry'] %}{{ serranda_open | bool }}
                  {% else %}false{% endif %}
                action: >-
                  {%- if r.floor_only -%}
                    {%- if proxy_mode == 'off' -%}off
                    {%- elif floor_on -%}heating
                    {%- else -%}idle{%- endif -%}
                  {%- elif aria_mode in ['off','unknown','unavailable'] -%}off
                  {%- elif floor_on and aria_mode == 'heat' -%}heating
                  {%- elif proxy_mode == 'off' -%}idle
                  {%- elif in_deficit | bool and aria_mode == 'heat' -%}heating
                  {%- elif in_deficit | bool and aria_mode == 'cool' -%}cooling
                  {%- elif in_deficit | bool and aria_mode == 'dry' -%}drying
                  {%- elif mitsu_mode == 'fan_only' and serranda_open | bool -%}idle
                  {%- elif mitsu_mode == 'fan_only' -%}fan
                  {%- else -%}idle{%- endif -%}
            - service: mqtt.publish
              data:
                topic: "cow/casa/{{ r.slug }}/action/state"
                payload: "{{ action | trim }}"
                retain: true
      - service: mqtt.publish
        data:
          topic: cow/casa/aria/action/state
          payload: >-
            {%- set m = mitsu_mode -%}
            {%- if m == 'off' -%}off
            {%- elif m == 'heat' -%}heating
            {%- elif m == 'cool' -%}cooling
            {%- elif m == 'dry' -%}drying
            {%- elif m == 'fan_only' -%}fan
            {%- else -%}idle{%- endif -%}
          retain: true
