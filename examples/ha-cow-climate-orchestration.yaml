        current_temperature_template: "{{ states('sensor.display_camera_2_temperature') | float(20) }}"
        target_temperature_template:  "{{ states('input_number.casa_studio_chiara_setpoint') | float(20) }}"
        hvac_mode_template:           "{{ states('input_select.casa_studio_chiara_mode') }}"
