# ---------------------------------------------------------------------------
# Cow Climate orchestration — coordinates Koolnova + Pavimento per room
# ---------------------------------------------------------------------------
# Drop this file into /config/packages/cow_climate.yaml (or any name you
# prefer) and make sure your configuration.yaml has:
#
#     homeassistant:
#       packages: !include_dir_named packages
#
# Then `Developer Tools → YAML → Reload all YAML configuration` (or just
# restart HA) and the climate.casa_* entities + their orchestration
# automation will appear.
#
# Design notes live in docs/06-house-hvac-architecture.md (Section F-bis).
# The user-facing decision parameters (FLOOR_OFFSET, BOOST_THRESHOLD,
# behaviour at idle, cool/fan_only forcing floor OFF, Sala+Cucina
# collapsed into a single proxy) are encoded directly in this file.
#
# Each room has three helpers (setpoint / mode / fan) that act as the
# persistent "state machine" of the proxy thermostat. A template climate
# reflects those helpers as a proper climate.* entity, and the single
# automation at the bottom of the file translates any change on a proxy
# (mode / setpoint / fan / current temp) into coordinated commands on
# the underlying Koolnova + Pavimento entities.
# ---------------------------------------------------------------------------

input_number:
  casa_sala_cucina_setpoint:    { name: "Sala & Cucina · Setpoint",   min: 15, max: 28, step: 0.5, unit_of_measurement: "°C", initial: 20, icon: mdi:thermometer }
  casa_camera_setpoint:         { name: "Camera · Setpoint",          min: 15, max: 28, step: 0.5, unit_of_measurement: "°C", initial: 20, icon: mdi:thermometer }
  casa_studio_chiara_setpoint:  { name: "Studio Chiara · Setpoint",   min: 15, max: 28, step: 0.5, unit_of_measurement: "°C", initial: 20, icon: mdi:thermometer }
  casa_camera_padronale_setpoint: { name: "Camera Padronale · Setpoint", min: 15, max: 28, step: 0.5, unit_of_measurement: "°C", initial: 20, icon: mdi:thermometer }
  casa_ingresso_pt_setpoint:    { name: "Ingresso PT · Setpoint",     min: 15, max: 28, step: 0.5, unit_of_measurement: "°C", initial: 20, icon: mdi:thermometer }

input_select:
  casa_sala_cucina_mode:        { name: "Sala & Cucina · Modo",       options: ["off", heat, cool, fan_only], initial: "off", icon: mdi:hvac }
  casa_sala_cucina_fan:         { name: "Sala & Cucina · Ventola",    options: [auto, low, medium, high],     initial: auto,  icon: mdi:fan }
  casa_camera_mode:             { name: "Camera · Modo",              options: ["off", heat, cool, fan_only], initial: "off", icon: mdi:hvac }
  casa_camera_fan:              { name: "Camera · Ventola",           options: [auto, low, medium, high],     initial: auto,  icon: mdi:fan }
  casa_studio_chiara_mode:      { name: "Studio Chiara · Modo",       options: ["off", heat, cool, fan_only], initial: "off", icon: mdi:hvac }
  casa_studio_chiara_fan:       { name: "Studio Chiara · Ventola",    options: [auto, low, medium, high],     initial: auto,  icon: mdi:fan }
  casa_camera_padronale_mode:   { name: "Camera Padronale · Modo",    options: ["off", heat, cool, fan_only], initial: "off", icon: mdi:hvac }
  casa_camera_padronale_fan:    { name: "Camera Padronale · Ventola", options: [auto, low, medium, high],     initial: auto,  icon: mdi:fan }
  casa_ingresso_pt_mode:        { name: "Ingresso PT · Modo",         options: ["off", heat, cool, fan_only], initial: "off", icon: mdi:hvac }
  casa_ingresso_pt_fan:         { name: "Ingresso PT · Ventola",      options: [auto, low, medium, high],     initial: auto,  icon: mdi:fan }

# --- Template climate entities ----------------------------------------------
# Each entity reads the three helpers above and exposes the standard climate
# actions. The actions only update the helpers — the orchestration automation
# at the bottom does the real work of pushing values to Koolnova / Pavimento.
#
# We pin hvac_action to a Jinja expression so the card on the wall display
# can tell whether the system is actively heating / cooling / idle, even when
# the proxy itself is just bookkeeping helpers.

template:
  - climate:
      - name: "Casa Sala & Cucina"
        unique_id: casa_sala_cucina
        availability_template: "{{ states('sensor.display_sala_temperature') not in ['unknown','unavailable'] }}"
        current_temperature_template: "{{ states('sensor.display_sala_temperature') | float(20) }}"
        target_temperature_template:  "{{ states('input_number.casa_sala_cucina_setpoint') | float(20) }}"
        hvac_mode_template:           "{{ states('input_select.casa_sala_cucina_mode') }}"
        fan_mode_template:            "{{ states('input_select.casa_sala_cucina_fan') }}"
        hvac_action_template: >-
          {% set m = states('input_select.casa_sala_cucina_mode') %}
          {% set t = states('input_number.casa_sala_cucina_setpoint') | float(20) %}
          {% set c = states('sensor.display_sala_temperature')      | float(20) %}
          {% if m == 'off' %}off
          {% elif m == 'cool' and c > t %}cooling
          {% elif m == 'heat' and c < t %}heating
          {% elif m == 'fan_only' %}fan
          {% else %}idle{% endif %}
        modes: ["off", heat, cool, fan_only]
        fan_modes: [auto, low, medium, high]
        min_temp: 15
        max_temp: 28
        temp_step: 0.5
        set_hvac_mode:
          - service: input_select.select_option
            target: { entity_id: input_select.casa_sala_cucina_mode }
            data: { option: "{{ hvac_mode }}" }
        set_temperature:
          - service: input_number.set_value
            target: { entity_id: input_number.casa_sala_cucina_setpoint }
            data: { value: "{{ temperature }}" }
        set_fan_mode:
          - service: input_select.select_option
            target: { entity_id: input_select.casa_sala_cucina_fan }
            data: { option: "{{ fan_mode }}" }

      - name: "Casa Camera"
