          {% set c = states('sensor.display_camera_1_temperature') | float(20) %}
          {% if m == 'off' %}off
          {% elif m == 'cool' and c > t %}cooling
          {% elif m == 'heat' and c < t %}heating
          {% elif m == 'fan_only' %}fan
          {% else %}idle{% endif %}
        modes: ["off", heat, cool, fan_only]
        fan_modes: [auto, low, medium, high]
        min_temp: 15
        max_temp: 28
        temp_step: 0.5
        set_hvac_mode:
          - service: input_select.select_option
            target: { entity_id: input_select.casa_camera_mode }
            data: { option: "{{ hvac_mode }}" }
        set_temperature:
          - service: input_number.set_value
            target: { entity_id: input_number.casa_camera_setpoint }
            data: { value: "{{ temperature }}" }
        set_fan_mode:
          - service: input_select.select_option
            target: { entity_id: input_select.casa_camera_fan }
