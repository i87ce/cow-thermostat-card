        current_temperature_template: "{{ states('sensor.display_camera_padronale_temperature') | float(20) }}"
        target_temperature_template:  "{{ states('input_number.casa_camera_padronale_setpoint') | float(20) }}"
        hvac_mode_template:           "{{ states('input_select.casa_camera_padronale_mode') }}"
