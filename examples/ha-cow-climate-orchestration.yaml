      - name: "Casa Ingresso PT"
        unique_id: casa_ingresso_pt
        availability_template: "{{ states('sensor.display_ingresso_pt_temperature') not in ['unknown','unavailable'] }}"
        current_temperature_template: "{{ states('sensor.display_ingresso_pt_temperature') | float(20) }}"
