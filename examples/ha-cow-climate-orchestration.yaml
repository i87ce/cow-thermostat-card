# --- Orchestration automation ------------------------------------------------
# Single automation, one job: whenever a proxy's mode / setpoint / fan changes
# OR the room temperature crosses the boost threshold, translate that into
# the right calls on Koolnova + Pavimento. The slug parameter selects which
# room to operate on at trigger time.

automation:
  - id: cow_climate_orchestrator
    alias: "Cow Climate — Orchestrator"
    description: "Coordinates Koolnova + Pavimento for each casa_<room> proxy"
    mode: queued
    max: 20
    trigger:
      # Any change of the user-facing controls per room
      - platform: state
        entity_id:
          # sala & cucina
          - input_number.casa_sala_cucina_setpoint
          - input_select.casa_sala_cucina_mode
          - input_select.casa_sala_cucina_fan
          # camera
          - input_number.casa_camera_setpoint
          - input_select.casa_camera_mode
          - input_select.casa_camera_fan
          # studio chiara
          - input_number.casa_studio_chiara_setpoint
          - input_select.casa_studio_chiara_mode
          - input_select.casa_studio_chiara_fan
          # camera padronale
          - input_number.casa_camera_padronale_setpoint
          - input_select.casa_camera_padronale_mode
          - input_select.casa_camera_padronale_fan
          # ingresso pt
          - input_number.casa_ingresso_pt_setpoint
          - input_select.casa_ingresso_pt_mode
          - input_select.casa_ingresso_pt_fan
      # Any room temperature change — re-evaluate the boost decision
      - platform: state
        entity_id:
          - sensor.display_sala_temperature
          - sensor.display_camera_1_temperature
          - sensor.display_camera_2_temperature
          - sensor.display_camera_padronale_temperature
          - sensor.display_ingresso_pt_temperature
    variables:
      # Mapping table: which room each trigger entity belongs to, and
      # which underlying climate.* entities it controls. Add a new row
      # here when adding a new proxy.
      rooms:
        sala_cucina:
          temp: sensor.display_sala_temperature
          mode_input: input_select.casa_sala_cucina_mode
          setpoint_input: input_number.casa_sala_cucina_setpoint
          fan_input: input_select.casa_sala_cucina_fan
          koolnova: ["climate.koolnova_sala", "climate.koolnova_cucina"]
          pavimento: climate.pavimento_sala
        camera:
          temp: sensor.display_camera_1_temperature
          mode_input: input_select.casa_camera_mode
          setpoint_input: input_number.casa_camera_setpoint
          fan_input: input_select.casa_camera_fan
          koolnova: ["climate.koolnova_camera_1"]
          pavimento: climate.pavimento_camera_1
        studio_chiara:
          temp: sensor.display_camera_2_temperature
          mode_input: input_select.casa_studio_chiara_mode
          setpoint_input: input_number.casa_studio_chiara_setpoint
          fan_input: input_select.casa_studio_chiara_fan
          koolnova: ["climate.koolnova_camera_2"]
          pavimento: climate.pavimento_camera_2
        camera_padronale:
          temp: sensor.display_camera_padronale_temperature
          mode_input: input_select.casa_camera_padronale_mode
          setpoint_input: input_number.casa_camera_padronale_setpoint
          fan_input: input_select.casa_camera_padronale_fan
          koolnova: ["climate.koolnova_camera_3"]
          pavimento: climate.pavimento_camera_padronale
        ingresso_pt:
          temp: sensor.display_ingresso_pt_temperature
          mode_input: input_select.casa_ingresso_pt_mode
          setpoint_input: input_number.casa_ingresso_pt_setpoint
          fan_input: input_select.casa_ingresso_pt_fan
          koolnova: ["climate.koolnova_ingresso_pt"]
          pavimento: climate.pavimento_ingresso_pt
      # Match the triggered entity_id to a slug
      slug: >-
        {% set tid = trigger.entity_id %}
        {% set ns = namespace(found='') %}
        {% for k, v in rooms.items() %}
          {% if tid in [v.temp, v.mode_input, v.setpoint_input, v.fan_input] %}
            {% set ns.found = k %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
      r: "{{ rooms[slug] }}"
      mode: "{{ states(r.mode_input) }}"
      setpoint: "{{ states(r.setpoint_input) | float(20) }}"
      fan: "{{ states(r.fan_input) }}"
      current: "{{ states(r.temp) | float(20) }}"
      delta: "{{ setpoint - current }}"
      FLOOR_OFFSET: 1.0
      BOOST_THRESHOLD: 1.5
    action:
      # Skip silently if we can't resolve the trigger to a room (defensive)
      - condition: template
        value_template: "{{ slug != '' }}"
      # Dispatch on user mode
      - choose:
          # -------------- OFF -------------------
          - conditions: "{{ mode == 'off' }}"
            sequence:
              - service: climate.set_hvac_mode
                target: { entity_id: "{{ r.koolnova }}" }
                data: { hvac_mode: "off" }
              - service: climate.set_hvac_mode
                target: { entity_id: "{{ r.pavimento }}" }
                data: { hvac_mode: "off" }
          # -------------- COOL ------------------
          - conditions: "{{ mode == 'cool' }}"
            sequence:
              - service: climate.set_hvac_mode
                target: { entity_id: "{{ r.koolnova }}" }
                data: { hvac_mode: "cool" }
              - service: climate.set_temperature
                target: { entity_id: "{{ r.koolnova }}" }
                data: { temperature: "{{ setpoint }}" }
              - service: climate.set_fan_mode
                target: { entity_id: "{{ r.koolnova }}" }
                data: { fan_mode: "{{ fan }}" }
              - service: climate.set_hvac_mode
                target: { entity_id: "{{ r.pavimento }}" }
                data: { hvac_mode: "off" }
          # -------------- FAN_ONLY --------------
          - conditions: "{{ mode == 'fan_only' }}"
            sequence:
              - service: climate.set_hvac_mode
                target: { entity_id: "{{ r.koolnova }}" }
                data: { hvac_mode: "fan_only" }
              - service: climate.set_fan_mode
                target: { entity_id: "{{ r.koolnova }}" }
                data: { fan_mode: "{{ fan }}" }
              - service: climate.set_hvac_mode
                target: { entity_id: "{{ r.pavimento }}" }
                data: { hvac_mode: "off" }
          # -------------- HEAT (the team mode) --
          - conditions: "{{ mode == 'heat' }}"
            sequence:
              # Floor: always on, aiming at setpoint - offset
              - service: climate.set_hvac_mode
                target: { entity_id: "{{ r.pavimento }}" }
                data: { hvac_mode: "heat" }
              - service: climate.set_temperature
                target: { entity_id: "{{ r.pavimento }}" }
                data: { temperature: "{{ setpoint - FLOOR_OFFSET }}" }
              # Koolnova: only as booster when the gap is large enough
              - choose:
                  - conditions: "{{ delta > BOOST_THRESHOLD }}"
                    sequence:
                      - service: climate.set_hvac_mode
                        target: { entity_id: "{{ r.koolnova }}" }
                        data: { hvac_mode: "heat" }
                      - service: climate.set_temperature
                        target: { entity_id: "{{ r.koolnova }}" }
                        data: { temperature: "{{ setpoint }}" }
                      - service: climate.set_fan_mode
                        target: { entity_id: "{{ r.koolnova }}" }
                        data: { fan_mode: "{{ fan }}" }
                default:
                  - service: climate.set_hvac_mode
                    target: { entity_id: "{{ r.koolnova }}" }
                    data: { hvac_mode: "off" }
