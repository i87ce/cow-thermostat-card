<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cow-thermostat-card — variant preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      html, body { margin: 0; padding: 0; background: #2a2a35; min-height: 100vh; }
      header {
        position: sticky; top: 0; z-index: 10;
        display: flex; flex-wrap: wrap; gap: .5rem;
        padding: .75rem 1rem; background: #1a1a25; color: #e9e9f0;
        border-bottom: 1px solid #3a3a4a;
      }
      header h1 { font-size: 1rem; margin: 0 1rem 0 0; font-weight: 600; }
      header label { display: flex; align-items: center; gap: .25rem; font-size: .8125rem; }
      select, button {
        background: #2c2c3a; color: #e9e9f0; border: 1px solid #4a4a5a;
        border-radius: .375rem; padding: .25rem .5rem; font-size: .8125rem;
      }
      button { cursor: pointer; }
      .stage {
        display: grid; place-items: center;
        padding: 2rem 1rem;
      }
      .frame {
        width: var(--size, 480px);
        height: var(--size, 480px);
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 1.25rem 4rem rgba(0,0,0,.45);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
        padding: 1rem;
      }
      .grid figure {
        display: flex; flex-direction: column; align-items: center; gap: .5rem;
        margin: 0; color: #e9e9f0; font-size: .75rem;
      }
      .grid .frame { width: 280px; height: 280px; }
      .label {
        background: #1a1a25; padding: .25rem .5rem; border-radius: .25rem;
      }
    </style>
    <script type="module" src="../dist/cow-thermostat-card.js"></script>
  </head>
  <body>
    <header>
      <h1>cow-thermostat-card preview</h1>
      <label>Variant
        <select id="variant">
          <option value="thermostat-heating">Thermostat — Heating</option>
          <option value="thermostat-cooling">Thermostat — Cooling</option>
          <option value="thermostat-off">Thermostat — Off</option>
          <option value="thermostat-idle">Thermostat — Idle</option>
          <option value="blinds-open">Blinds — Open</option>
          <option value="blinds-half">Blinds — Half</option>
          <option value="blinds-closed">Blinds — Closed</option>
          <option value="blinds-moving">Blinds — Moving</option>
          <option value="lights-bright">Lights — Bright</option>
          <option value="lights-dim">Lights — Dim</option>
          <option value="lights-off">Lights — Off</option>
          <option value="lights-night">Lights — Night</option>
        </select>
      </label>
      <label>Size
        <select id="size">
          <option value="384">384 (Figma)</option>
          <option value="480" selected>480 (SAWD1 likely)</option>
          <option value="600">600</option>
          <option value="720">720</option>
        </select>
      </label>
      <label>Initial view
        <select id="view">
          <option value="thermostat" selected>Thermostat</option>
          <option value="blinds">Blinds</option>
          <option value="lights">Lights</option>
        </select>
      </label>
      <button id="grid">Show 12-grid</button>
    </header>

    <main class="stage">
      <div class="frame" id="frame"></div>
    </main>

    <section class="grid" id="grid-section" style="display: none"></section>

    <script type="module">
      const ROOM = "Living Room";

      function buildHass(variantKey) {
        const [device, state] = variantKey.split("-");
        const climate = {
          entity_id: "climate.living_thermostat",
          state: "heat",
          attributes: {
            current_temperature: 21,
            temperature: 24,
            hvac_action: "heating",
            fan_mode: "auto",
            fan_modes: ["auto", "low", "medium", "high"],
            min_temp: 5,
            max_temp: 35,
            target_temp_step: 0.5,
            current_humidity: 48,
          },
        };
        const cover = {
          entity_id: "cover.living_blinds",
          state: "open",
          attributes: { current_position: 100 },
        };
        const light = {
          entity_id: "light.living_main",
          state: "on",
          attributes: { brightness: 220 },
        };
        const outdoor = {
          entity_id: "sensor.weather_temperature",
          state: "12",
          attributes: { unit_of_measurement: "°C" },
        };

        if (device === "thermostat") {
          if (state === "heating") Object.assign(climate.attributes, { hvac_action: "heating", current_temperature: 21, temperature: 24 });
          if (state === "cooling") Object.assign(climate, { state: "cool" }, { attributes: { ...climate.attributes, hvac_action: "cooling", current_temperature: 26, temperature: 22 } });
          if (state === "off") Object.assign(climate, { state: "off" }, { attributes: { ...climate.attributes, hvac_action: "off" } });
          if (state === "idle") Object.assign(climate, { state: "heat" }, { attributes: { ...climate.attributes, hvac_action: "idle", current_temperature: 24, temperature: 24 } });
        }
        if (device === "blinds") {
          if (state === "open")   Object.assign(cover, { state: "open",    attributes: { current_position: 100 } });
          if (state === "half")   Object.assign(cover, { state: "open",    attributes: { current_position: 50  } });
          if (state === "closed") Object.assign(cover, { state: "closed",  attributes: { current_position: 0   } });
          if (state === "moving") Object.assign(cover, { state: "opening", attributes: { current_position: 35  } });
        }
        if (device === "lights") {
          if (state === "bright") Object.assign(light, { state: "on",  attributes: { brightness: 240 } });
          if (state === "dim")    Object.assign(light, { state: "on",  attributes: { brightness: 110 } });
          if (state === "off")    Object.assign(light, { state: "off", attributes: { brightness: 0   } });
          if (state === "night")  Object.assign(light, { state: "on",  attributes: { brightness: 13  } });
        }

        return {
          states: {
            "climate.living_thermostat": climate,
            "cover.living_blinds": cover,
            "light.living_main": light,
            "sensor.weather_temperature": outdoor,
          },
          callService: async (...args) => console.log("callService", ...args),
          locale: { language: navigator.language || "en" },
        };
      }

      const initialViewFor = (key) => {
        if (key.startsWith("thermostat")) return "thermostat";
        if (key.startsWith("blinds")) return "blinds";
        return "lights";
      };

      const frame = document.getElementById("frame");
      const variantSel = document.getElementById("variant");
      const sizeSel = document.getElementById("size");
      const viewSel = document.getElementById("view");
      const gridBtn = document.getElementById("grid");
      const gridSection = document.getElementById("grid-section");

      function mountSingle() {
        gridSection.style.display = "none";
        frame.parentElement.style.display = "";
        const size = Number(sizeSel.value);
        frame.style.setProperty("--size", `${size}px`);
        frame.replaceChildren();
        const card = document.createElement("cow-thermostat-card");
        card.setConfig({
          type: "custom:cow-thermostat-card",
          room: ROOM,
          climate: "climate.living_thermostat",
          light: "light.living_main",
          cover: "cover.living_blinds",
          outdoor_temp: "sensor.weather_temperature",
          initial_view: initialViewFor(variantSel.value) || viewSel.value,
        });
        card.hass = buildHass(variantSel.value);
        frame.appendChild(card);
      }

      function mountGrid() {
        frame.parentElement.style.display = "none";
        gridSection.style.display = "grid";
        gridSection.replaceChildren();
        const variants = Array.from(variantSel.options).map((o) => o.value);
        for (const v of variants) {
          const fig = document.createElement("figure");
          const f = document.createElement("div");
          f.className = "frame";
          const card = document.createElement("cow-thermostat-card");
          card.setConfig({
            type: "custom:cow-thermostat-card",
            room: ROOM,
            climate: "climate.living_thermostat",
            light: "light.living_main",
            cover: "cover.living_blinds",
            outdoor_temp: "sensor.weather_temperature",
            initial_view: initialViewFor(v),
          });
          card.hass = buildHass(v);
          f.appendChild(card);
          const label = document.createElement("figcaption");
          label.className = "label";
          label.textContent = v;
          fig.append(f, label);
          gridSection.appendChild(fig);
        }
      }

      variantSel.addEventListener("change", mountSingle);
      sizeSel.addEventListener("change", mountSingle);
      viewSel.addEventListener("change", mountSingle);
      gridBtn.addEventListener("click", () => {
        if (gridSection.style.display === "none" || !gridSection.style.display)
          mountGrid();
        else mountSingle();
      });

      mountSingle();
    </script>
  </body>
</html>
