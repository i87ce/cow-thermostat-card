<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cow-room-dashboard-card preview (XL)</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; background: #2a2a35; min-height: 100vh; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #e9e9f0; }
      header { padding: 0.75rem 1rem; background: #1a1a25; border-bottom: 1px solid #3a3a4a; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
      header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
      header label { display: flex; align-items: center; gap: .25rem; font-size: .8125rem; }
      select, input[type=range] { background: #2c2c3a; color: #e9e9f0; border: 1px solid #4a4a5a; border-radius: .375rem; padding: .25rem .5rem; font-size: .8125rem; }
      input[type=range] { width: 12rem; padding: 0; }
      .stage { padding: 1.5rem; display: grid; place-items: center; }
      .frame { width: var(--w, 1280px); background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1.25rem 4rem rgba(0,0,0,.45); }
      .badge { font-variant-numeric: tabular-nums; font-size: .75rem; opacity: .7; min-width: 3.5rem; text-align: right; }
    </style>
  </head>
  <body>
    <header>
      <h1>cow-room-dashboard-card preview (XL 1280×800)</h1>
      <label>Width
        <select id="w">
          <option value="1280" selected>1280px (Wall Display XL)</option>
          <option value="1024">1024px</option>
          <option value="800">800px</option>
          <option value="1440">1440px</option>
        </select>
      </label>
      <label>Sun elev
        <input type="range" id="elev" min="-30" max="80" value="45" step="1" />
        <span class="badge" id="elev-out">45°</span>
      </label>
      <label>Sun azim
        <input type="range" id="azim" min="60" max="300" value="180" step="1" />
        <span class="badge" id="azim-out">180°</span>
      </label>
      <label>Weather
        <select id="wx">
          <option value="sunny" selected>sunny</option>
          <option value="partlycloudy">partlycloudy</option>
          <option value="cloudy">cloudy</option>
          <option value="rainy">rainy</option>
          <option value="pouring">pouring</option>
          <option value="snowy">snowy</option>
          <option value="fog">fog</option>
          <option value="lightning-rainy">lightning-rainy</option>
          <option value="clear-night">clear-night</option>
        </select>
      </label>
      <label>Moon
        <select id="moon">
          <option value="new_moon">new_moon</option>
          <option value="waxing_crescent">waxing_crescent</option>
          <option value="first_quarter">first_quarter</option>
          <option value="waxing_gibbous" selected>waxing_gibbous</option>
          <option value="full_moon">full_moon</option>
          <option value="waning_gibbous">waning_gibbous</option>
          <option value="last_quarter">last_quarter</option>
          <option value="waning_crescent">waning_crescent</option>
        </select>
      </label>
      <label>Music
        <select id="music">
          <option value="idle">idle (pill)</option>
          <option value="playing" selected>playing (ribbon)</option>
          <option value="paused">paused (ribbon)</option>
        </select>
      </label>
    </header>
    <main class="stage">
      <div class="frame" id="frame"></div>
    </main>

    <script type="module">
      await import(`../dist/cow-thermostat-card.js?t=${Date.now()}`);
      // EXACT same config as the HA dashboard /walldisplay-sala-cucina/0
      // so we can reproduce the runtime error locally.
      const ROOMS = [
        // ── Living ────────────────────────────────────────────────────
        {
          name: "Sala & Cucina",
          icon: "🛋",
          group: "Living",
          // Il Display Sala non ha sensore ambient (in arrivo): per ora
          // niente temperature/humidity in questo chip.
          light: [
            "light.led_calda_sala",
            "light.led_sala_fredda",
            "light.luce_tavolo_sala",
            "light.led_corridoio_p1",
            "light.luce_cucina",
            "light.led_cucina",
          ],
          light_labels: ["Sala calda","Sala fredda","Sala tavolo","Corridoio","Cucina","Cucina LED"],
          cover: [
            "cover.tapparella_sala",
            "cover.tapparella_sala_terrazza",
            "cover.tapparella_cucina",
            "cover.tapparella_cucina_terrazza",
          ],
          cover_labels: ["Sala","Sala terr.","Cucina","Cucina terr."],
        },

        // ── Zona notte ────────────────────────────────────────────────
        { name: "Padronale", icon: "🛏", group: "Zona notte",
          // luci comodino + LED soffitto + LED cabina armadio (la cabina
          // non ha più un proprio chip: i suoi controlli vivono qui)
          light: [
            "light.comodino_01",
            "light.comodino_02",
            "light.led_camera_3",
            "light.led_cabina_armadio",
          ],
          light_labels: ["Comodino 1","Comodino 2","LED","Cabina"],
          cover: "cover.tapparella_camera_padronale" },
        { name: "Studio Chiara", icon: "🛌", group: "Zona notte",
          light: "light.led_camera_2_2", cover: "cover.tapparella_camera_2" },
        { name: "Camera 1", icon: "🛌", group: "Zona notte",
          light: "light.led_camera_1", cover: "cover.tapparella_camera_1" },

        // ── Servizi ───────────────────────────────────────────────────
        { name: "Bagno P.", icon: "🚿", group: "Servizi",
          light: ["light.luce_bagno_padronale","light.luce_specchio_bagno_padronale"], light_labels: ["Soffitto","Specchio"],
          cover: "cover.tapparella_bagno_padronale" },
        { name: "Bagno O.", icon: "🚿", group: "Servizi",
          light: ["light.led_bagno_piccolo","light.luce_specchio_bagno_piccolo"], light_labels: ["Soffitto","Specchio"],
          cover: "cover.tapparella_bagno_piccola" },
        { name: "Lavanderia", icon: "🧺", group: "Servizi",
          light: "light.luce_bagno_pt", cover: "cover.tapparella_bagno_pt" },

        // ── Altro ─────────────────────────────────────────────────────
        { name: "Studio", icon: "💻", group: "Altro",
          light: ["light.luce_calda_studio","light.luce_fredda_studio"], light_labels: ["Calda","Fredda"],
          cover: "cover.tapparella_studio" },
        { name: "Garage", icon: "🚗", group: "Altro",
          light: "light.luce_box" },
        { name: "Ingresso PT", icon: "🚪", group: "Altro",
          light: ["light.luce_scala","light.sgabuzzino_pt"], light_labels: ["Scala","Sgabuzzino"] },
        { name: "Esterno", icon: "🌳", group: "Altro",
          light: ["light.led_terrazzo","light.led_esterno_p1","light.luce_esterna_studio"],
          light_labels: ["Terrazzo","Esterno P1","Studio"] },
      ];

      function buildHass({ elev, azim, weather, moon, music }) {
        const states = {};
        // Sun (built-in HA entity) — drives the live sky + sun position.
        // For the preview, synthesize a sunset/sunrise window centered
        // around "now" so the synthesized moon sits high in the sky
        // regardless of when we look at the preview.
        const now = Date.now();
        const aboveHorizon = elev > 0;
        const nextSetting = new Date(now + 4 * 3600_000).toISOString();
        // Pretend yesterday's sunset was 4h ago and sunrise is 4h away,
        // i.e. we're at "moon midnight" → moon peaks high in the middle.
        const nextRising = new Date(now + 4 * 3600_000).toISOString();
        states["sun.sun"] = {
          entity_id: "sun.sun",
          state: aboveHorizon ? "above_horizon" : "below_horizon",
          attributes: {
            elevation: elev,
            azimuth: azim,
            rising: azim < 180,
            next_setting: nextSetting,
            next_rising: nextRising,
          },
        };
        // Moon (HA built-in `moon:` integration)
        states["sensor.moon"] = {
          entity_id: "sensor.moon",
          state: moon,
          attributes: {},
        };
        // light entities (some on)  — matched to ROOMS config
        states["light.led_calda_sala"]    = { entity_id: "light.led_calda_sala", state: "on",  attributes: { brightness: 240, friendly_name: "Sala calda" } };
        states["light.led_sala_fredda"]   = { entity_id: "light.led_sala_fredda", state: "off", attributes: {} };
        states["light.luce_tavolo_sala"]  = { entity_id: "light.luce_tavolo_sala", state: "on", attributes: { brightness: 130 } };
        states["light.luce_cucina"] = { entity_id: "light.luce_cucina", state: "off", attributes: {} };
        states["light.led_cucina"] = { entity_id: "light.led_cucina", state: "off", attributes: {} };
        states["light.led_corridoio_p1"] = { entity_id: "light.led_corridoio_p1", state: "off", attributes: {} };
        states["light.comodino_01"] = { entity_id: "light.comodino_01", state: "on", attributes: { brightness: 60, friendly_name: "Comodino 1" } };
        states["light.comodino_02"] = { entity_id: "light.comodino_02", state: "off", attributes: {} };
        states["light.led_camera_3"] = { entity_id: "light.led_camera_3", state: "off", attributes: {} };
        states["light.led_cabina_armadio"] = { entity_id: "light.led_cabina_armadio", state: "off", attributes: {} };
        states["light.led_camera_2_2"] = { entity_id: "light.led_camera_2_2", state: "on", attributes: { brightness: 100 } };
        states["light.led_camera_1"] = { entity_id: "light.led_camera_1", state: "off", attributes: {} };
        states["light.luce_calda_studio"] = { entity_id: "light.luce_calda_studio", state: "off", attributes: {} };
        states["light.luce_fredda_studio"] = { entity_id: "light.luce_fredda_studio", state: "off", attributes: {} };
        states["light.luce_bagno_padronale"] = { entity_id: "light.luce_bagno_padronale", state: "off", attributes: {} };
        states["light.luce_specchio_bagno_padronale"] = { entity_id: "light.luce_specchio_bagno_padronale", state: "off", attributes: {} };
        states["light.led_bagno_piccolo"] = { entity_id: "light.led_bagno_piccolo", state: "off", attributes: {} };
        states["light.luce_specchio_bagno_piccolo"] = { entity_id: "light.luce_specchio_bagno_piccolo", state: "off", attributes: {} };
        states["light.luce_bagno_pt"] = { entity_id: "light.luce_bagno_pt", state: "off", attributes: {} };
        states["cover.tapparella_bagno_pt"] = { entity_id: "cover.tapparella_bagno_pt", state: "closed", attributes: { current_position: 0 } };
        // Garage / Scala / Esterno
        states["light.luce_box"] = { entity_id: "light.luce_box", state: "off", attributes: {} };
        states["light.luce_scala"] = { entity_id: "light.luce_scala", state: "off", attributes: {} };
        states["light.sgabuzzino_pt"] = { entity_id: "light.sgabuzzino_pt", state: "off", attributes: {} };
        states["light.led_terrazzo"] = { entity_id: "light.led_terrazzo", state: "on", attributes: { brightness: 200 } };
        states["light.led_esterno_p1"] = { entity_id: "light.led_esterno_p1", state: "off", attributes: {} };
        states["light.luce_esterna_studio"] = { entity_id: "light.luce_esterna_studio", state: "off", attributes: {} };
        // climates
        states["climate.termostato_sala"] = {
          entity_id: "climate.termostato_sala", state: "heat",
          attributes: {
            current_temperature: 21, temperature: 22.5, current_humidity: 48,
            hvac_action: "heating",
            min_temp: 5, max_temp: 35, target_temp_step: 0.5,
            fan_mode: "auto", fan_modes: ["auto","low","medium","high"],
            friendly_name: "Termostato Sala",
          },
        };
        states["sensor.shellywalldisplay_d2d2c5_temperature"] = {
          entity_id: "sensor.shellywalldisplay_d2d2c5_temperature",
          state: "22",
          attributes: { device_class: "temperature", unit_of_measurement: "°C" },
        };
        states["sensor.shellywalldisplay_d2d2c5_humidity"] = {
          entity_id: "sensor.shellywalldisplay_d2d2c5_humidity",
          state: "48.9",
          attributes: { device_class: "humidity", unit_of_measurement: "%" },
        };
        states["cover.tapparella_bagno_piccola"] = { entity_id: "cover.tapparella_bagno_piccola", state: "open", attributes: { current_position: 75 } };
        // covers (some open)
        states["cover.tapparella_sala"] = { entity_id: "cover.tapparella_sala", state: "open", attributes: { current_position: 100 } };
        states["cover.tapparella_sala_terrazza"] = { entity_id: "cover.tapparella_sala_terrazza", state: "open", attributes: { current_position: 50 } };
        states["cover.tapparella_cucina"] = { entity_id: "cover.tapparella_cucina", state: "closed", attributes: { current_position: 0 } };
        states["cover.tapparella_cucina_terrazza"] = { entity_id: "cover.tapparella_cucina_terrazza", state: "open", attributes: { current_position: 100 } };
        states["cover.tapparella_camera_padronale"] = { entity_id: "cover.tapparella_camera_padronale", state: "open", attributes: { current_position: 100 } };
        states["cover.tapparella_camera_2"] = { entity_id: "cover.tapparella_camera_2", state: "closed", attributes: { current_position: 0 } };
        states["cover.tapparella_camera_1"] = { entity_id: "cover.tapparella_camera_1", state: "closed", attributes: { current_position: 0 } };
        states["cover.tapparella_studio"] = { entity_id: "cover.tapparella_studio", state: "closed", attributes: { current_position: 0 } };
        states["cover.tapparella_bagno_padronale"] = { entity_id: "cover.tapparella_bagno_padronale", state: "open", attributes: { current_position: 100 } };
        // weather + media
        states["weather.casa"] = { entity_id: "weather.casa", state: weather, attributes: { temperature: 18, humidity: 62, apparent_temperature: 16, wind_speed: 7 } };
        // Speaker state — controlled by the "Music" dropdown in the toolbar.
        // When playing/paused, mocks a Cesare Cremonini track so the
        // ribbon+cinema can show realistic art + progress.
        states["media_player.display_sala"] = {
          entity_id: "media_player.display_sala",
          state: music,
          attributes: music === "idle"
            ? {
                friendly_name: "Display Sala",
                media_title: "RDS Relax",
                entity_picture: "https://rdsrelax.it/images/logo.png",
                volume_level: 1.0,
                media_content_type: "music",
                supported_features: 152117,
              }
            : {
                friendly_name: "Display Sala",
                media_title: "Felicità Puttana",
                media_artist: "Thegiornalisti",
                media_album_name: "Completamente",
                media_duration: 215,
                media_position: 84,
                media_position_updated_at: new Date(Date.now() - 8000).toISOString(),
                entity_picture: "https://i.scdn.co/image/ab67616d0000b273cd24f3b3a82bafc8a5f3aaaa",
                volume_level: 0.6,
                media_content_type: "music",
                supported_features: 152117,
              },
        };
        // Stub MA responses for the preview so the music drawer can render
        // results without a real HA backend.
        const MOCK_PLAYLISTS = [
          { uri: "library://playlist/1", name: "All favorited tracks", subtitle: "Tutti i preferiti" },
          { uri: "library://playlist/7", name: "Liked Songs Alessio", subtitle: "Canzoni che ti piacciono" },
          { uri: "library://playlist/8", name: "Anni 90", subtitle: "Hit anni '90" },
          { uri: "library://playlist/18", name: "Disney Italiano!", subtitle: "Karaoke ufficiale" },
          { uri: "library://playlist/15", name: "Karaoke", subtitle: "Da cantare" },
          { uri: "library://playlist/13", name: "Carnazza", subtitle: "Per le serate" },
        ];
        const MOCK_TRACKS = [
          { uri: "spotify--mock://track/1", name: "Felicità Puttana", artist: "Thegiornalisti", subtitle: "Completamente" },
          { uri: "spotify--mock://track/2", name: "Ora che non ho più te", artist: "Cesare Cremonini", subtitle: "Possibili scenari" },
          { uri: "spotify--mock://track/3", name: "La Nuova Stella Di Broadway", artist: "Cesare Cremonini", subtitle: "Il primo bacio sulla Luna" },
        ];
        const MOCK_RADIOS_FAVORITES = [
          { uri: "radiobrowser--mock://radio/1", media_type: "radio", name: "Radio Deejay", subtitle: "Italia · Pop" },
          { uri: "radiobrowser--mock://radio/2", media_type: "radio", name: "RDS 100% Grandi Successi", subtitle: "Italia · Hits" },
          { uri: "radiobrowser--mock://radio/3", media_type: "radio", name: "Radio Italia Solo Musica Italiana", subtitle: "Italia" },
          { uri: "radiobrowser--mock://radio/4", media_type: "radio", name: "m2o", subtitle: "Italia · Dance" },
        ];
        const MOCK_RADIOS_SEARCH = [
          { uri: "radiobrowser--mock://radio/5", media_type: "radio", name: "Radio Capital", subtitle: "Italia · Rock" },
          { uri: "radiobrowser--mock://radio/6", media_type: "radio", name: "Radio 105", subtitle: "Italia · Pop" },
          { uri: "radiobrowser--mock://radio/7", media_type: "radio", name: "Virgin Radio Italy", subtitle: "Italia · Rock" },
        ];

        return {
          states,
          callService: async (domain, service, data, target, _notifyOnError, returnResponse) => {
            console.log("callService", domain, service, data, target);
            if (returnResponse) {
              if (domain === "music_assistant" && service === "get_library") {
                if (data?.media_type === "playlist")
                  return { response: { items: MOCK_PLAYLISTS } };
                if (data?.media_type === "radio")
                  return { response: { items: MOCK_RADIOS_FAVORITES } };
                return { response: { items: [] } };
              }
              if (domain === "music_assistant" && service === "search") {
                const types = Array.isArray(data?.media_type)
                  ? data.media_type
                  : [data?.media_type];
                if (types.includes("radio")) {
                  return { response: { items: MOCK_RADIOS_SEARCH } };
                }
                return { response: { tracks: MOCK_TRACKS } };
              }
              if (domain === "music_assistant" && service === "get_queue") {
                return { response: { items: [] } };
              }
            }
            return undefined;
          },
          locale: { language: "it-IT" },
        };
      }

      const frame = document.getElementById("frame");
      const wSel = document.getElementById("w");
      const elevEl = document.getElementById("elev");
      const azimEl = document.getElementById("azim");
      const wxEl = document.getElementById("wx");
      const moonEl = document.getElementById("moon");
      const musicEl = document.getElementById("music");
      const elevOut = document.getElementById("elev-out");
      const azimOut = document.getElementById("azim-out");

      let card = null;

      function buildConfig() {
        return {
          elev: Number(elevEl.value),
          azim: Number(azimEl.value),
          weather: wxEl.value,
          moon: moonEl.value,
          music: musicEl.value,
        };
      }

      function mount() {
        frame.style.setProperty("--w", `${wSel.value}px`);
        frame.replaceChildren();
        card = document.createElement("cow-room-dashboard-card");
        card.setConfig({
          type: "custom:cow-room-dashboard-card",
          rooms: ROOMS,
          weather_entity: "weather.casa",
          sun_entity: "sun.sun",
          moon_entity: "sensor.moon",
          media_player: "media_player.display_sala",
          music_assistant_id: "01KR70XN8WQ46Y3B20BQKHG27P",
          // Radio presets are no longer hardcoded — the drawer Radio tab
          // does a live search against MA's Radio Browser provider and
          // shows the user's favorited stations from MA's library.
          locale: "it-IT",
          scenes: [
            { name: "Tutto OFF", icon: "○", accent: "#8C8C99" },
            { name: "Apri tutto", icon: "△", accent: "#26A673" },
            { name: "Notte", icon: "☾", accent: "#1F1F2E" },
            { name: "Cinema", icon: "■", accent: "#FA6B2E" },
          ],
        });
        card.hass = buildHass(buildConfig());
        frame.appendChild(card);
      }

      function refreshHass() {
        elevOut.textContent = `${elevEl.value}°`;
        azimOut.textContent = `${azimEl.value}°`;
        if (card) card.hass = buildHass(buildConfig());
      }

      wSel.addEventListener("change", mount);
      [elevEl, azimEl, wxEl, moonEl, musicEl].forEach((el) => {
        el.addEventListener("input", refreshHass);
        el.addEventListener("change", refreshHass);
      });
      mount();
    </script>
  </body>
</html>
