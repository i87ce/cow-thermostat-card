# ============================================================================
# Studio — termostato "vero" per il Daikin (Onecta) col sensore BT
# ============================================================================
# Creato via API il 2026-08-02 (helpers via WebSocket, automazioni via
# POST /api/config/automation/config/cow_studio_*). Questo file è la
# copia di riferimento: NON viene letto da HA, serve solo come doc.
#
# Problema: il Daikin regola con la sua sonda interna (sull'unità, legge
# l'aria che spinge). La card mostra setpoint e modo da helper + sensore
# stanza, quindi senza queste automazioni l'unità si autolimita a idle
# quando la sua sonda è a target mentre la stanza è ancora calda
# (es. set 22, sonda Daikin 22 idle, stanza 27, compressore fermo).
#
# Sensore stanza (2026-08-14): Bluetooth H&T accoppiato al Wall Display
# Studio — sensor.shellywalldisplay_000822397b9e_temperature / _humidity.
# (Lo Zigbee Aqara termostato_studio_ale è fermo, non usarlo.)
#
# Comportamento:
#   * Attivo solo in heat/cool (dry e fan_only non vengono mai ciclati).
#   * Raffredda fino a SP esatto (`T <= SP`), riarma a `SP + 0,5 °C`.
#     Riscalda fino a SP esatto (`T >= SP`), riarma a `SP - 0,5 °C`.
#     Allineato al latch Cool/Dry di cow_climate.py (REARM = 0.5).
#   * Mentre è acceso, il Daikin viene spinto al suo min/max macchina
#     (cool 18 °C / heat 32 °C) — è una sorgente, non un termostato.
#     Lo spegnimento lo decide il sensore BT, non la sonda interna.
#   * A setpoint raggiunto il Daikin viene SPENTO (pausa termostato ON);
#     quando la stanza deriva oltre REARM viene riacceso con lo stesso
#     modo e la stessa spinta.
#   * Uno spegnimento MANUALE non viene mai annullato: la riaccensione
#     scatta solo se era stato il termostato a spegnere (flag pausa).
#   * Anti-cicli: 4 min di stato stabile solo per on/off, NON per la
#     spinta del setpoint macchina.
#   * Sensore stantio (> 2 h senza update): non si spegne né si
#     riaccende da una lettura morta. Se l'unità è già on, resta in
#     spinta così il compressore gira davvero. Notifica persistente.
#
# Mezzi gradi: il target visibile è input_number.studio_clima_target
# (step 0.5). La card mostra/scrive l'helper; il Daikin non riceve
# quel numero — riceve solo 18/32 di spinta. La memoria copia un
# cambio setpoint dal telecomando Daikin → helper SOLO se non è la
# spinta 18/32 (né il vecchio floor/ceil dell'helper).
#
# Helpers (creati in HA, elencati qui per riferimento):
#   input_select.studio_clima_modo        # heat/cool/dry/fan_only/heat_cool
#   input_number.studio_clima_target      # 16–30 °C, step 0.5
#   input_boolean.studio_clima_pausa_termostato
# ============================================================================

automation:
  - id: cow_studio_clima_memoria
    alias: "Studio clima — memoria modo e setpoint"
    description: >-
      Tiene in input_select/input_number l'ultimo modo non-off e l'ultimo
      setpoint scelto dal telecomando Daikin. Qualsiasi attivazione
      manuale azzera la pausa del termostato. Non copia la spinta macchina
      (18 cool / 32 heat) né il vecchio floor/ceil dell'helper.
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id: climate.condizionatore_studio
        to: [heat, cool, dry, fan_only, heat_cool]
      - platform: state
        entity_id: climate.condizionatore_studio
        attribute: temperature
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.attribute is not defined and
                     trigger.to_state.state in ['heat','cool','dry','fan_only','heat_cool'] }}
            sequence:
              - service: input_select.select_option
                target: { entity_id: input_select.studio_clima_modo }
                data: { option: "{{ trigger.to_state.state }}" }
              - service: input_boolean.turn_off
                target: { entity_id: input_boolean.studio_clima_pausa_termostato }
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.attribute is defined and
                     trigger.to_state.attributes.temperature is not none and
                     (trigger.to_state.attributes.temperature | float) not in [18, 32] and
                     (trigger.to_state.attributes.temperature | float) != (
                       (states('input_number.studio_clima_target') | float(21)) | round(0, 'floor')
                         if states('input_select.studio_clima_modo') == 'cool' else
                       (states('input_number.studio_clima_target') | float(21)) | round(0, 'ceil')
                         if states('input_select.studio_clima_modo') == 'heat' else
                       (states('input_number.studio_clima_target') | float(21)) | round
                     ) }}
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.studio_clima_target }
                data: { value: "{{ trigger.to_state.attributes.temperature }}" }

  - id: cow_studio_termostato
    alias: "Studio termostato — Daikin on/off da sensore display"
    description: >-
      Termostato sul sensore BT del Wall Display Studio
      (shellywalldisplay_000822397b9e): raffredda/riscalda
      fino a SP esatto, riarma a ±0,5 °C, e mentre è acceso spinge il
      Daikin a 18 °C (cool) / 32 °C (heat) così il compressore non va
      in idle sulla sonda interna. Sensore stantio (>2 h): niente on/off
      automatico, solo spinta se già acceso. Spegnimento manuale non
      viene mai annullato. Anti-cicli 4 min solo su on/off.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: sensor.shellywalldisplay_000822397b9e_temperature
      - platform: state
        entity_id:
          - input_number.studio_clima_target
          - input_select.studio_clima_modo
      - platform: state
        entity_id: climate.condizionatore_studio
        to:
          - heat
          - cool
          - off
          - dry
          - fan_only
          - heat_cool
      - platform: time_pattern
        minutes: "/5"
    variables:
      t: >-
        {% set s = states.sensor.shellywalldisplay_000822397b9e_temperature %}
        {{ s.state | float(none) if s is not none and
           (now() - s.last_updated).total_seconds() < 7200 else none }}
      target: "{{ states('input_number.studio_clima_target') | float(21) }}"
      modo: "{{ states('input_select.studio_clima_modo') }}"
      ac: "{{ states('climate.condizionatore_studio') }}"
      rearm: 0.5
      drive: "{{ 18 if modo == 'cool' else 32 if modo == 'heat' else none }}"
      ac_sp: "{{ state_attr('climate.condizionatore_studio','temperature') | float(none) }}"
      stable: >-
        {{ states.climate.condizionatore_studio is not none and
           (now() - states.climate.condizionatore_studio.last_changed).total_seconds() > 240 }}
    condition:
      - condition: template
        value_template: >-
          {{ modo in ['heat','cool'] and ac not in ['unavailable','unknown'] }}
    action:
      - choose:
          # Setpoint raggiunto su sensore VIVO → pausa + spegni
          - conditions:
              - condition: template
                value_template: >-
                  {{ t is number and stable and ac != 'off' and
                     ((modo == 'heat' and t >= target) or
                      (modo == 'cool' and t <= target)) }}
            sequence:
              - service: input_boolean.turn_on
                target: { entity_id: input_boolean.studio_clima_pausa_termostato }
              - service: climate.turn_off
                target: { entity_id: climate.condizionatore_studio }
              - service: persistent_notification.dismiss
                data: { notification_id: cow_studio_sensor_stale }
          # Stanza derivata E l'avevamo spento noi → riaccendi + spinta
          - conditions:
              - condition: state
                entity_id: input_boolean.studio_clima_pausa_termostato
                state: "on"
              - condition: template
                value_template: >-
                  {{ t is number and stable and ac == 'off' and
                     ((modo == 'heat' and t <= target - rearm) or
                      (modo == 'cool' and t >= target + rearm)) }}
            sequence:
              - service: climate.set_hvac_mode
                target: { entity_id: climate.condizionatore_studio }
                data: { hvac_mode: "{{ modo }}" }
              - delay: { seconds: 3 }
              - service: climate.set_temperature
                target: { entity_id: climate.condizionatore_studio }
                data: { temperature: "{{ drive }}" }
              - service: input_boolean.turn_off
                target: { entity_id: input_boolean.studio_clima_pausa_termostato }
              - service: persistent_notification.dismiss
                data: { notification_id: cow_studio_sensor_stale }
          # Unità già on → spinta macchina (anche con Zigbee stantio)
          - conditions:
              - condition: template
                value_template: >-
                  {{ ac != 'off' and drive is not none and
                     (ac_sp is none or (ac_sp | float) != (drive | float)) }}
            sequence:
              - service: climate.set_temperature
                target: { entity_id: climate.condizionatore_studio }
                data: { temperature: "{{ drive }}" }
              - if:
                  - condition: template
                    value_template: "{{ t is not number }}"
                then:
                  - service: persistent_notification.create
                    data:
                      notification_id: cow_studio_sensor_stale
                      title: Termostato studio — sensore fermo
                      message: >-
                        Il sensore BT del Display Studio non aggiorna da
                        più di 2 ore. Il Daikin resta in spinta
                        ({{ drive }} °C) finché non spegni a mano o il
                        sensore non torna in vita.

  - id: cow_studio_clima_sync_setpoint
    alias: "Studio clima — spinta Daikin (setpoint macchina)"
    description: >-
      Quando il target helper cambia e il Daikin è in heat/cool, scrive
      la spinta macchina (18 cool / 32 heat), non il target utente.
      A regolare la stanza è cow_studio_termostato sul sensore BT del display.
    mode: restart
    trigger:
      - platform: state
        entity_id: input_number.studio_clima_target
    variables:
      ac: "{{ states('climate.condizionatore_studio') }}"
      expected: "{{ 18 if ac == 'cool' else 32 if ac == 'heat' else none }}"
    condition:
      - condition: template
        value_template: "{{ ac in ['heat','cool'] and expected is not none }}"
      - condition: template
        value_template: >-
          {{ (state_attr('climate.condizionatore_studio','temperature') | float(-99)) != (expected | float) }}
    action:
      - service: climate.set_temperature
        target: { entity_id: climate.condizionatore_studio }
        data: { temperature: "{{ expected }}" }
