<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Mockup D — B + Cinema mode on demand (hybrid)</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  /* Proposta D — il MIX scelto:
     - idle: hero piena con un "last played" piccolo nel header (option A
       della tua scelta precedente)
     - playing (minimized): ribbon stile B sotto i tile, hero compressa
     - playing (cinema): la hero diventa player full come C, con un ✕ per
       tornare al ribbon e un pulsante per aprire il browse
     - browse drawer: slide-up, può essere aperto sia dal ribbon che dalla
       cinema view

     Trigger:
     - tap ALBUM ART sul ribbon  → entra in CINEMA
     - tap [⛶] sul ribbon         → entra in CINEMA
     - tap [📋] sul ribbon        → apre DRAWER
     - tap [✕] in cinema          → torna a RIBBON
     - tap [Browse] in cinema     → apre DRAWER */

  /* ───────────── RIBBON (state B) ───────────── */
  .music-ribbon {
    position: absolute;
    left: 1.5rem; right: 1.5rem;
    top: 19.5rem;
    height: 5rem;
    background: var(--cow-surface-white);
    border: 0.0625rem solid var(--cow-surface-border);
    border-radius: 1.25rem;
    display: grid;
    grid-template-columns: 5rem 1fr auto auto auto;
    gap: 0.875rem;
    align-items: center;
    padding: 0 1rem 0 0;
    transition: opacity 220ms ease, transform 220ms ease;
  }
  .music-ribbon.hidden { opacity: 0; transform: translateY(-1rem); pointer-events: none; }
  .music-ribbon .art {
    width: 5rem; height: 5rem;
    border-radius: 1.25rem 0 0 1.25rem;
    cursor: pointer;
    position: relative;
  }
  .music-ribbon .art::after {
    content: "⛶";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
    opacity: 0;
    background: rgba(0,0,0,0.4);
    border-radius: 1.25rem 0 0 1.25rem;
    transition: opacity 160ms ease;
  }
  .music-ribbon .art:hover::after { opacity: 1; }
  .music-ribbon .info { min-width: 0; cursor: pointer; }
  .music-ribbon .title { font-size: 1.0625rem; font-weight: 700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .music-ribbon .artist { font-size: 0.8125rem; color: var(--cow-text-secondary); margin-top: 0.125rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .music-ribbon .progress-mini { margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .music-ribbon .progress-mini .bar { width: 16rem; height: 0.1875rem; background: var(--cow-surface-button-bg); border-radius: 0.09375rem; position: relative; }
  .music-ribbon .progress-mini .bar::before { content:""; position:absolute; left:0; top:0; bottom:0; width:40%; background: var(--cow-text-primary); border-radius:0.09375rem; }
  .music-ribbon .progress-mini .time { font-size: 0.6875rem; color: var(--cow-text-secondary); font-variant-numeric: tabular-nums; }
  .music-ribbon .controls { display: flex; align-items: center; gap: 0.25rem; }
  .music-ribbon .vol { display: flex; align-items: center; gap: 0.5rem; padding-left: 0.75rem; border-left: 1px solid var(--cow-surface-border); }
  .music-ribbon .vol .slider { width: 5rem; height: 0.1875rem; background: var(--cow-surface-button-bg); border-radius: 0.09375rem; position: relative; }
  .music-ribbon .vol .slider::before { content:""; position:absolute; left:0; top:0; bottom:0; width:60%; background: var(--cow-text-primary); border-radius:0.09375rem; }
  .music-ribbon .extras { display: flex; align-items: center; gap: 0.25rem; padding-left: 0.75rem; padding-right: 0.25rem; border-left: 1px solid var(--cow-surface-border); }

  /* Shrunk hero (during ribbon mode) */
  .hero.shrunk { top: 25rem; height: 17.5rem; }
  .hero.shrunk .clock { font-size: 7rem; top: 4rem; }
  .hero.shrunk .date  { top: 13.25rem; }
  .hero.shrunk .sun   { right: 7rem; top: 3.5rem; width: 7rem; height: 7rem; }
  .hero.shrunk .meteo { bottom: 2.75rem; }
  .hero.shrunk .meteo .t { font-size: 4.5rem; }

  /* ───────────── HEADER pill — last played (idle) ───────────── */
  .last-played-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    height: 2.25rem;
    padding: 0 1rem 0 0.5rem;
    background: var(--cow-surface-white);
    border: 0.0625rem solid var(--cow-surface-border);
    border-radius: 1.125rem;
    font-size: 0.8125rem;
    font-weight: 500;
    cursor: pointer;
  }
  .last-played-pill .mini-art { width: 1.5rem; height: 1.5rem; border-radius: 0.375rem; }

  /* ───────────── CINEMA MODE (state C) ───────────── */
  .hero.cinema {
    background: linear-gradient(135deg, #0f1b3a 0%, #1f2f5e 40%, #3d2b54 75%, #6b3f6b 100%);
    color: white;
    display: grid;
    grid-template-columns: 18rem 1fr;
    gap: 2.5rem;
    padding: 2.25rem 2.5rem;
    overflow: hidden;
  }
  .hero.cinema .sun, .hero.cinema .clock, .hero.cinema .date, .hero.cinema .meteo { display: none; }
  .hero.cinema .album-big {
    width: 18rem; height: 18rem;
    border-radius: 1rem;
    background-image: linear-gradient(135deg, #1ed760 0%, #11783a 50%, #0a1e0f 100%);
    box-shadow: 0 1rem 3rem rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .hero.cinema .album-big::before {
    content: "♪";
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 8rem; color: white; opacity: 0.9;
  }
  .hero.cinema .player-info { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .hero.cinema .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .hero.cinema .clock-mini { font-size: 1.375rem; font-weight: 500; opacity: 0.85; }
  .hero.cinema .clock-mini .date-mini { font-size: 0.8125rem; opacity: 0.7; font-weight: 400; }
  .hero.cinema .close-btn {
    width: 2.75rem; height: 2.75rem;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white; border: 0;
    font-size: 1.25rem;
    cursor: pointer;
    transition: background-color 160ms ease;
  }
  .hero.cinema .close-btn:hover { background: rgba(255,255,255,0.28); }
  .hero.cinema .track-title { font-size: 3rem; font-weight: 300; line-height: 1.05; letter-spacing: -0.03125rem; }
  .hero.cinema .track-meta { font-size: 1.0625rem; opacity: 0.78; margin-top: 0.375rem; }
  .hero.cinema .progress { margin-top: 1.125rem; }
  .hero.cinema .bar { height: 0.25rem; background: rgba(255,255,255,0.18); border-radius: 0.125rem; position: relative; }
  .hero.cinema .bar::before { content:""; position:absolute; left:0; top:0; bottom:0; width:40%; background: white; border-radius: 0.125rem; }
  .hero.cinema .time-row { display: flex; justify-content: space-between; font-size: 0.75rem; opacity: 0.65; margin-top: 0.5rem; font-variant-numeric: tabular-nums; }
  .hero.cinema .controls-row { display: flex; align-items: center; gap: 0.625rem; margin-top: 1rem; }
  .hero.cinema .controls-row .btn-icon { color: white; background: rgba(255,255,255,0.1); }
  .hero.cinema .controls-row .btn-icon:hover { background: rgba(255,255,255,0.22); }
  .hero.cinema .controls-row .btn-icon.primary { background: white; color: var(--cow-text-primary); }
  .hero.cinema .vol-cinema { display: flex; align-items: center; gap: 0.5rem; padding-left: 0.75rem; opacity: 0.85; font-size: 0.8125rem; }
  .hero.cinema .vol-cinema .slider { width: 8rem; height: 0.1875rem; background: rgba(255,255,255,0.18); border-radius: 0.09375rem; position: relative; }
  .hero.cinema .vol-cinema .slider::before { content:""; position:absolute; left:0; top:0; bottom:0; width:60%; background: white; border-radius: 0.09375rem; }
  .hero.cinema .browse-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .hero.cinema .browse-btn {
    padding: 0.5rem 1rem;
    border-radius: 1rem;
    background: rgba(255,255,255,0.14);
    color: white;
    font-weight: 600;
    font-size: 0.8125rem;
    cursor: pointer;
    border: none;
  }
  .hero.cinema .browse-btn:hover { background: rgba(255,255,255,0.24); }

  /* ───────────── DRAWER (state D) ───────────── */
  .scrim {
    position: absolute; inset: 0;
    background: rgba(31,31,46,0.32);
    opacity: 0; pointer-events: none;
    transition: opacity 280ms ease;
    z-index: 5;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .music-drawer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 30rem;
    background: var(--cow-surface-white);
    border-top-left-radius: 1.5rem;
    border-top-right-radius: 1.5rem;
    box-shadow: 0 -0.5rem 2rem rgba(31,31,46,0.18);
    transform: translateY(100%);
    transition: transform 320ms cubic-bezier(.2,.7,.2,1);
    padding: 1rem 1.5rem 1.5rem;
    z-index: 6;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .music-drawer.open { transform: translateY(0); }
  .drawer-handle { width: 3rem; height: 0.25rem; border-radius: 0.125rem; background: var(--cow-text-disabled); align-self: center; }
  .tabs { display: flex; gap: 0.5rem; padding-top: 0.5rem; }
  .tab { padding: 0.5rem 1rem; border-radius: 1rem; font-weight: 600; font-size: 0.875rem; background: var(--cow-surface-button-bg); color: var(--cow-text-primary); cursor: pointer; }
  .tab[data-active] { background: var(--cow-text-primary); color: white; }
  .search-box { width: 100%; height: 2.25rem; border-radius: 1.125rem; border: 1px solid var(--cow-surface-border); padding: 0 1rem; font-size: 0.875rem; background: var(--cow-surface-background); }
  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.625rem; }
  .quick-item { background: var(--cow-surface-background); border: 1px solid var(--cow-surface-border); border-radius: 0.75rem; padding: 0.625rem 0.875rem; cursor: pointer; display:flex; align-items:center; gap: 0.625rem; }
  .quick-item .icon-sq { width: 2rem; height: 2rem; border-radius: 0.375rem; display:flex; align-items:center; justify-content:center; color: white; }
  .quick-item .qi-name { font-weight: 600; font-size: 0.875rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .quick-item .qi-sub { font-size: 0.6875rem; color: var(--cow-text-secondary); }
  .section-h { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.0625rem; text-transform: uppercase; color: var(--cow-text-secondary); }

  /* Toolbar state cycler */
  .state-cycle {
    display: inline-flex;
    gap: 0.25rem;
    background: #2c2c3a;
    padding: 0.25rem;
    border-radius: 0.5rem;
  }
  .state-cycle button {
    background: transparent;
    color: #e9e9f0;
    border: 0;
    padding: 0.25rem 0.625rem;
    font-size: 0.8125rem;
    font-weight: 600;
    border-radius: 0.375rem;
    cursor: pointer;
  }
  .state-cycle button.active { background: #4d8cd1; color: white; }
</style>
</head>
<body>
<header class="toolbar">
  <h1>Mockup <b>D</b> — Hybrid: ribbon B + cinema C (chiamato dal ribbon)</h1>
  <div class="state-cycle" id="cycle">
    <button data-state="idle">idle</button>
    <button data-state="ribbon" class="active">ribbon</button>
    <button data-state="cinema">cinema</button>
    <button data-state="drawer">drawer (over ribbon)</button>
  </div>
  <span style="flex:1"></span>
  <a href="index.html">‹ tutti</a>
</header>
<div class="stage"><div class="frame" id="frame"></div></div>

<script type="module">
import { MOCK, fmt, renderShell } from "./_shell.js";

const frame = document.getElementById("frame");

let state = "ribbon";

function render() {
  renderShell(frame, { hideMusicPill: true });
  const pills = frame.querySelector(".top-pills");
  const hero = frame.querySelector(".hero");

  // 1. Idle → last-played pill in header
  if (state === "idle") {
    const lp = document.createElement("div");
    lp.className = "last-played-pill";
    lp.innerHTML = `<div class="mini-art album-art"></div>▶ ${MOCK.track.title}`;
    pills.appendChild(lp);
    lp.addEventListener("click", () => { state = "ribbon"; render(); });
    return; // hero stays full
  }

  // For ribbon + cinema states, the hero gets re-styled
  // 2. Ribbon → keep tiles, add ribbon, shrink hero
  if (state === "ribbon" || state === "drawer") {
    hero.classList.add("shrunk");
    const ribbon = document.createElement("div");
    ribbon.className = "music-ribbon";
    ribbon.innerHTML = `
      <div class="art album-art" id="r-art" title="Apri cinema mode"></div>
      <div class="info" id="r-info">
        <div class="title">${MOCK.track.title}</div>
        <div class="artist">${MOCK.track.artist} · ${MOCK.track.album}</div>
        <div class="progress-mini">
          <span class="time">${fmt(MOCK.track.progress)}</span>
          <div class="bar"></div>
          <span class="time">${fmt(MOCK.track.duration)}</span>
        </div>
      </div>
      <div class="controls">
        <button class="btn-icon">⏮</button>
        <button class="btn-icon primary">⏸</button>
        <button class="btn-icon">⏭</button>
      </div>
      <div class="vol">
        <span style="font-size:0.875rem">🔊</span>
        <div class="slider"></div>
      </div>
      <div class="extras">
        <button class="btn-icon" id="r-browse" title="Sfoglia Spotify / Radio">📋</button>
        <button class="btn-icon" id="r-expand" title="Big now playing">⛶</button>
      </div>
    `;
    frame.appendChild(ribbon);

    ribbon.querySelector("#r-art").addEventListener("click", () => { state = "cinema"; render(); });
    ribbon.querySelector("#r-info").addEventListener("click", () => { state = "cinema"; render(); });
    ribbon.querySelector("#r-expand").addEventListener("click", () => { state = "cinema"; render(); });
    ribbon.querySelector("#r-browse").addEventListener("click", () => { state = "drawer"; render(); });

    if (state === "drawer") { addDrawer(true); }
    return;
  }

  // 3. Cinema → hero replaces fully
  if (state === "cinema") {
    hero.classList.add("cinema");
    hero.innerHTML = `
      <div class="album-big"></div>
      <div class="player-info">
        <div class="top-row">
          <div class="clock-mini">07:04
            <div class="date-mini">mercoledì 13 maggio 2026</div>
          </div>
          <button class="close-btn" id="cinema-close" title="Riduci a ribbon">✕</button>
        </div>
        <div>
          <div class="track-title">${MOCK.track.title}</div>
          <div class="track-meta">${MOCK.track.artist} · ${MOCK.track.album}</div>
          <div class="progress">
            <div class="bar"></div>
            <div class="time-row">
              <span>${fmt(MOCK.track.progress)}</span>
              <span>${fmt(MOCK.track.duration)}</span>
            </div>
          </div>
          <div class="controls-row">
            <button class="btn-icon">🔀</button>
            <button class="btn-icon">⏮</button>
            <button class="btn-icon primary">⏸</button>
            <button class="btn-icon">⏭</button>
            <button class="btn-icon">🔁</button>
            <div class="vol-cinema">
              <span>🔊</span>
              <div class="slider"></div>
              <span>${MOCK.volume}%</span>
            </div>
          </div>
          <div class="browse-row">
            <button class="browse-btn" id="cinema-browse">Sfoglia Spotify…</button>
            <button class="browse-btn">📻 Deejay</button>
            <button class="browse-btn">📻 RDS 105</button>
            <button class="browse-btn">📻 Radio Italia</button>
            <span style="flex:1"></span>
            <span style="opacity:.6;font-size:0.8125rem;align-self:center">📻 ${MOCK.device}</span>
          </div>
        </div>
      </div>
    `;
    hero.querySelector("#cinema-close").addEventListener("click", () => { state = "ribbon"; render(); });
    hero.querySelector("#cinema-browse").addEventListener("click", () => { state = "drawer"; render(); /* drawer over ribbon for simplicity */ });
    return;
  }
}

function addDrawer(open=false) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  if (open) scrim.classList.add("open");
  frame.appendChild(scrim);

  const drawer = document.createElement("div");
  drawer.className = "music-drawer";
  if (open) drawer.classList.add("open");
  drawer.innerHTML = `
    <div class="drawer-handle"></div>
    <div style="display:grid;grid-template-columns:6rem 1fr auto;gap:1rem;align-items:center">
      <div class="album-art" style="width:6rem;height:6rem;border-radius:0.75rem"></div>
      <div>
        <div style="font-size:1.25rem;font-weight:700">${MOCK.track.title}</div>
        <div style="color:var(--cow-text-secondary);font-size:0.875rem">${MOCK.track.artist} · ${MOCK.track.album}</div>
      </div>
      <div style="background:var(--cow-surface-button-bg);border-radius:1rem;padding:0.25rem 0.75rem;font-size:0.75rem;font-weight:600">📻 ${MOCK.device}</div>
    </div>
    <div class="tabs">
      <div class="tab" data-active>Spotify</div>
      <div class="tab">Radio</div>
      <div class="tab">Coda</div>
    </div>
    <input class="search-box" placeholder="Cerca su Spotify…" />
    <div class="section-h">LE TUE PLAYLIST</div>
    <div class="quick-grid">
      ${MOCK.playlists.map(p => `
        <div class="quick-item">
          <div class="icon-sq" style="background:linear-gradient(135deg,#1ed760,#0e7c3a)">♪</div>
          <div><div class="qi-name">${p.name}</div><div class="qi-sub">${p.desc}</div></div>
        </div>`).join("")}
    </div>
    <div class="section-h">RADIO</div>
    <div class="quick-grid">
      ${MOCK.radios.map(r => `
        <div class="quick-item">
          <div class="icon-sq" style="background:${r.color}">${r.icon}</div>
          <div><div class="qi-name">${r.name}</div><div class="qi-sub">In diretta</div></div>
        </div>`).join("")}
    </div>
  `;
  frame.appendChild(drawer);
  scrim.addEventListener("click", () => { state = "ribbon"; render(); });
}

// Wire the cycle buttons
document.querySelectorAll(".state-cycle button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".state-cycle button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    state = b.dataset.state;
    render();
  });
});

render();
</script>
</body>
</html>
