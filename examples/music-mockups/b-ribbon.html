<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Mockup B — Music ribbon auto-hide</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  /* Proposta B: nessuna pillola nell'header. Quando la musica suona,
     un ribbon orizzontale appare sotto le chip, sopra l'hero. Quando
     idle, sparisce e la hero torna a piena altezza.

     Tap sul ribbon → drawer di browse (stesso pattern della Proposta A). */

  /* Music ribbon */
  .music-ribbon {
    position: absolute;
    left: 1.5rem; right: 1.5rem;
    top: 19.5rem;
    height: 5rem;
    background: var(--cow-surface-white);
    border: 0.0625rem solid var(--cow-surface-border);
    border-radius: 1.25rem;
    display: grid;
    grid-template-columns: 5rem 1fr auto auto;
    gap: 1rem;
    align-items: center;
    padding: 0 1.25rem 0 0;
    cursor: pointer;
    transition: box-shadow 160ms ease, transform 220ms ease, opacity 220ms ease;
  }
  .music-ribbon:hover { box-shadow: 0 0.25rem 1rem rgba(31,31,46,0.06); }
  .music-ribbon.hidden { opacity: 0; transform: translateY(-1rem); pointer-events: none; }

  .music-ribbon .art {
    width: 5rem; height: 5rem;
    border-radius: 1.25rem 0 0 1.25rem;
  }
  .music-ribbon .info { min-width: 0; }
  .music-ribbon .title { font-size: 1.0625rem; font-weight: 700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .music-ribbon .artist {
    font-size: 0.8125rem;
    color: var(--cow-text-secondary);
    margin-top: 0.125rem;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .music-ribbon .progress-mini {
    margin-top: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .music-ribbon .progress-mini .bar {
    width: 16rem; height: 0.1875rem;
    background: var(--cow-surface-button-bg);
    border-radius: 0.09375rem;
    position: relative;
  }
  .music-ribbon .progress-mini .bar::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:40%; background: var(--cow-text-primary); border-radius:0.09375rem;
  }
  .music-ribbon .progress-mini .time { font-size: 0.6875rem; color: var(--cow-text-secondary); font-variant-numeric: tabular-nums; }
  .music-ribbon .controls { display: flex; align-items: center; gap: 0.25rem; }
  .music-ribbon .vol {
    display: flex; align-items: center; gap: 0.5rem;
    padding-left: 0.75rem;
    border-left: 1px solid var(--cow-surface-border);
    margin-left: 0.5rem;
  }
  .music-ribbon .vol .slider { width: 6rem; height: 0.1875rem; background: var(--cow-surface-button-bg); border-radius: 0.09375rem; position: relative; }
  .music-ribbon .vol .slider::before { content:""; position:absolute; left:0; top:0; bottom:0; width:60%; background: var(--cow-text-primary); border-radius:0.09375rem; }

  /* When music ribbon is visible we shrink the hero by 5.5rem */
  .hero.shrunk {
    top: 25rem;
    height: 17.5rem;
  }
  .hero.shrunk .clock { font-size: 7rem; top: 4rem; }
  .hero.shrunk .date  { top: 13.25rem; }
  .hero.shrunk .sun   { right: 7rem; top: 3.5rem; width: 7rem; height: 7rem; }
  .hero.shrunk .meteo { bottom: 2.75rem; }
  .hero.shrunk .meteo .t { font-size: 4.5rem; }

  /* When music is idle, hero is full size + we show a small "ultimo
     ascoltato" pill in the top-right of the header. */
  .last-played-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    height: 2.25rem;
    padding: 0 1rem;
    background: var(--cow-surface-white);
    border: 0.0625rem solid var(--cow-surface-border);
    border-radius: 1.125rem;
    font-size: 0.8125rem;
    font-weight: 500;
    cursor: pointer;
  }
  .last-played-pill .mini-art { width: 1.25rem; height: 1.25rem; border-radius: 0.25rem; }

  /* Drawer (identical to mockup A, simplified) */
  .scrim {
    position: absolute; inset: 0;
    background: rgba(31,31,46,0.32);
    opacity: 0; pointer-events: none;
    transition: opacity 280ms ease;
    z-index: 5;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .music-drawer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 30rem;
    background: var(--cow-surface-white);
    border-top-left-radius: 1.5rem;
    border-top-right-radius: 1.5rem;
    box-shadow: 0 -0.5rem 2rem rgba(31,31,46,0.18);
    transform: translateY(100%);
    transition: transform 320ms cubic-bezier(.2,.7,.2,1);
    padding: 1rem 1.5rem 1.5rem;
    z-index: 6;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .music-drawer.open { transform: translateY(0); }
  .drawer-handle { width: 3rem; height: 0.25rem; border-radius: 0.125rem; background: var(--cow-text-disabled); align-self: center; }
  .tabs { display: flex; gap: 0.5rem; padding-top: 0.5rem; }
  .tab { padding: 0.5rem 1rem; border-radius: 1rem; font-weight: 600; font-size: 0.875rem; background: var(--cow-surface-button-bg); color: var(--cow-text-primary); cursor: pointer; }
  .tab[data-active] { background: var(--cow-text-primary); color: white; }
  .search-box { width: 100%; height: 2.25rem; border-radius: 1.125rem; border: 1px solid var(--cow-surface-border); padding: 0 1rem; font-size: 0.875rem; background: var(--cow-surface-background); }
  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.625rem; }
  .quick-item { background: var(--cow-surface-background); border: 1px solid var(--cow-surface-border); border-radius: 0.75rem; padding: 0.625rem 0.875rem; cursor: pointer; display:flex; align-items:center; gap: 0.625rem; }
  .quick-item .icon-sq { width: 2rem; height: 2rem; border-radius: 0.375rem; display:flex; align-items:center; justify-content:center; color: white; }
  .quick-item .qi-name { font-weight: 600; font-size: 0.875rem; }
  .quick-item .qi-sub { font-size: 0.6875rem; color: var(--cow-text-secondary); }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.875rem;
    background: var(--cow-blinds-medium);
    color: white;
    border-radius: 1rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-size: 0.875rem;
  }
</style>
</head>
<body>
<header class="toolbar">
  <h1>Mockup <b>B</b> — Ribbon auto-hide (sotto le tile, sopra hero)</h1>
  <button class="toggle" id="toggle-play">⏯ Toggle: playing / idle</button>
  <span class="pill">tap sul ribbon per il browse</span>
  <span style="flex:1"></span>
  <a href="a-minicard.html">‹ A</a>
  <a href="index.html">tutti</a>
  <a href="c-cinema.html">C ›</a>
</header>
<div class="stage"><div class="frame" id="frame"></div></div>

<script type="module">
import { MOCK, fmt, renderShell } from "./_shell.js";
const frame = document.getElementById("frame");
renderShell(frame, { hideMusicPill: true });

// Mount the "last played" pill in the top-pills slot (visible only when idle)
const pills = frame.querySelector(".top-pills");
const lastPlayed = document.createElement("div");
lastPlayed.className = "last-played-pill";
lastPlayed.innerHTML = `<div class="mini-art album-art"></div>▶ ${MOCK.track.title}`;
pills.appendChild(lastPlayed);

// Music ribbon (visible when playing)
const ribbon = document.createElement("div");
ribbon.className = "music-ribbon";
ribbon.innerHTML = `
  <div class="art album-art"></div>
  <div class="info">
    <div class="title">${MOCK.track.title}</div>
    <div class="artist">${MOCK.track.artist} · ${MOCK.track.album}</div>
    <div class="progress-mini">
      <span class="time">${fmt(MOCK.track.progress)}</span>
      <div class="bar"></div>
      <span class="time">${fmt(MOCK.track.duration)}</span>
    </div>
  </div>
  <div class="controls">
    <button class="btn-icon">⏮</button>
    <button class="btn-icon primary">⏸</button>
    <button class="btn-icon">⏭</button>
  </div>
  <div class="vol">
    <span style="font-size:0.875rem">🔊</span>
    <div class="slider"></div>
  </div>
`;
frame.appendChild(ribbon);

// Drawer with browse
const scrim = document.createElement("div");
scrim.className = "scrim";
frame.appendChild(scrim);
const drawer = document.createElement("div");
drawer.className = "music-drawer";
drawer.innerHTML = `
  <div class="drawer-handle"></div>
  <div style="display:grid;grid-template-columns:6rem 1fr auto;gap:1rem;align-items:center">
    <div class="album-art" style="width:6rem;height:6rem;border-radius:0.75rem"></div>
    <div>
      <div style="font-size:1.25rem;font-weight:700">${MOCK.track.title}</div>
      <div style="color:var(--cow-text-secondary);font-size:0.875rem">${MOCK.track.artist} · ${MOCK.track.album}</div>
    </div>
    <div style="background:var(--cow-surface-button-bg);border-radius:1rem;padding:0.25rem 0.75rem;font-size:0.75rem;font-weight:600">📻 ${MOCK.device}</div>
  </div>
  <div class="tabs">
    <div class="tab" data-active>Spotify</div>
    <div class="tab">Radio</div>
    <div class="tab">Coda</div>
  </div>
  <input class="search-box" placeholder="Cerca su Spotify…" />
  <div style="font-size:0.75rem;font-weight:700;letter-spacing:0.0625rem;text-transform:uppercase;color:var(--cow-text-secondary);margin-bottom:-0.25rem">LE TUE PLAYLIST</div>
  <div class="quick-grid">
    ${MOCK.playlists.map(p => `
      <div class="quick-item">
        <div class="icon-sq" style="background:linear-gradient(135deg,#1ed760,#0e7c3a)">♪</div>
        <div>
          <div class="qi-name">${p.name}</div>
          <div class="qi-sub">${p.desc}</div>
        </div>
      </div>`).join("")}
  </div>
  <div style="font-size:0.75rem;font-weight:700;letter-spacing:0.0625rem;text-transform:uppercase;color:var(--cow-text-secondary);margin-bottom:-0.25rem">RADIO</div>
  <div class="quick-grid">
    ${MOCK.radios.map(r => `
      <div class="quick-item">
        <div class="icon-sq" style="background:${r.color}">${r.icon}</div>
        <div>
          <div class="qi-name">${r.name}</div>
          <div class="qi-sub">In diretta</div>
        </div>
      </div>`).join("")}
  </div>
`;
frame.appendChild(drawer);

const hero = frame.querySelector(".hero");

let playing = true;
function applyState() {
  if (playing) {
    ribbon.classList.remove("hidden");
    hero.classList.add("shrunk");
    lastPlayed.style.display = "none";
  } else {
    ribbon.classList.add("hidden");
    hero.classList.remove("shrunk");
    lastPlayed.style.display = "";
  }
}
applyState();
document.getElementById("toggle-play").addEventListener("click", () => { playing = !playing; applyState(); });

const open = () => { scrim.classList.add("open"); drawer.classList.add("open"); };
const close = () => { scrim.classList.remove("open"); drawer.classList.remove("open"); };
ribbon.addEventListener("click", open);
lastPlayed.addEventListener("click", open);
scrim.addEventListener("click", close);
</script>
</body>
</html>
