<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Mockup C — Hero replace (cinema mode)</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  /* Proposta C: la hero stessa diventa il player quando la musica suona.
     L'orologio si sposta in alto a destra piccolo. Quando idle, torna
     live sky pieno con un piccolo "ultimo ascoltato" inline. */

  /* Hero in cinema mode */
  .hero.cinema {
    background: linear-gradient(135deg, #0f1b3a 0%, #1f2f5e 40%, #3d2b54 75%, #6b3f6b 100%);
    color: white;
    display: grid;
    grid-template-columns: 18rem 1fr;
    gap: 2.5rem;
    padding: 2.5rem;
    overflow: hidden;
  }
  .hero.cinema .sun, .hero.cinema .clock, .hero.cinema .date, .hero.cinema .meteo { display: none; }
  .hero.cinema .album-big {
    width: 18rem; height: 18rem;
    border-radius: 1rem;
    background-image: linear-gradient(135deg, #1ed760 0%, #11783a 50%, #0a1e0f 100%);
    box-shadow: 0 1rem 3rem rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .hero.cinema .album-big::before {
    content: "♪";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8rem;
    color: white;
    opacity: 0.9;
  }
  .hero.cinema .player-info { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .hero.cinema .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .hero.cinema .clock-mini {
    font-size: 1.5rem;
    font-weight: 500;
    text-align: right;
    opacity: 0.85;
  }
  .hero.cinema .clock-mini .date-mini { font-size: 0.875rem; opacity: 0.7; font-weight: 400; }
  .hero.cinema .track-title { font-size: 3.25rem; font-weight: 300; line-height: 1.05; letter-spacing: -0.0625rem; }
  .hero.cinema .track-meta { font-size: 1.125rem; opacity: 0.75; margin-top: 0.5rem; }
  .hero.cinema .progress { margin-top: 1.25rem; }
  .hero.cinema .bar { height: 0.25rem; background: rgba(255,255,255,0.18); border-radius: 0.125rem; position: relative; }
  .hero.cinema .bar::before { content:""; position:absolute; left:0; top:0; bottom:0; width:40%; background: white; border-radius: 0.125rem; }
  .hero.cinema .time-row { display: flex; justify-content: space-between; font-size: 0.8125rem; opacity: 0.65; margin-top: 0.5rem; font-variant-numeric: tabular-nums; }
  .hero.cinema .controls-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1rem;
  }
  .hero.cinema .controls-row .btn-icon {
    color: white;
    background: rgba(255,255,255,0.1);
  }
  .hero.cinema .controls-row .btn-icon:hover { background: rgba(255,255,255,0.22); }
  .hero.cinema .controls-row .btn-icon.primary {
    background: white;
    color: var(--cow-text-primary);
  }
  .hero.cinema .controls-row .btn-icon.primary:hover { background: #eee; }
  .hero.cinema .browse-row {
    display: flex; gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .hero.cinema .browse-btn {
    padding: 0.5rem 1rem;
    border-radius: 1rem;
    background: rgba(255,255,255,0.12);
    color: white;
    font-weight: 600;
    font-size: 0.875rem;
    cursor: pointer;
    border: none;
    backdrop-filter: blur(0); /* mtk6580: no blur */
  }
  .hero.cinema .browse-btn:hover { background: rgba(255,255,255,0.22); }

  /* Idle hero: small "ultimo ascoltato" pill inside the hero bottom-right */
  .hero.idle .last-played-inline {
    position: absolute;
    right: 4rem; bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 1rem 0.5rem 0.5rem;
    background: rgba(255,255,255,0.92);
    border-radius: 1.625rem;
    cursor: pointer;
  }
  .hero.idle .last-played-inline .mini-art { width: 2rem; height: 2rem; border-radius: 0.5rem; }
  .hero.idle .last-played-inline .pre { font-size: 0.6875rem; color: var(--cow-text-secondary); text-transform: uppercase; letter-spacing: 0.0625rem; font-weight: 700; }
  .hero.idle .last-played-inline .name { font-size: 0.875rem; font-weight: 600; color: var(--cow-text-primary); }
  .hero.idle .last-played-inline .resume { width: 2rem; height: 2rem; background: var(--cow-text-primary); color: white; border: 0; border-radius: 50%; }

  /* Drawer reuse */
  .scrim {
    position: absolute; inset: 0;
    background: rgba(31,31,46,0.32);
    opacity: 0; pointer-events: none;
    transition: opacity 280ms ease;
    z-index: 5;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .music-drawer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 30rem;
    background: var(--cow-surface-white);
    border-top-left-radius: 1.5rem;
    border-top-right-radius: 1.5rem;
    box-shadow: 0 -0.5rem 2rem rgba(31,31,46,0.18);
    transform: translateY(100%);
    transition: transform 320ms cubic-bezier(.2,.7,.2,1);
    padding: 1rem 1.5rem 1.5rem;
    z-index: 6;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .music-drawer.open { transform: translateY(0); }
  .drawer-handle { width: 3rem; height: 0.25rem; border-radius: 0.125rem; background: var(--cow-text-disabled); align-self: center; }
  .tabs { display: flex; gap: 0.5rem; padding-top: 0.5rem; }
  .tab { padding: 0.5rem 1rem; border-radius: 1rem; font-weight: 600; font-size: 0.875rem; background: var(--cow-surface-button-bg); color: var(--cow-text-primary); cursor: pointer; }
  .tab[data-active] { background: var(--cow-text-primary); color: white; }
  .search-box { width: 100%; height: 2.25rem; border-radius: 1.125rem; border: 1px solid var(--cow-surface-border); padding: 0 1rem; font-size: 0.875rem; background: var(--cow-surface-background); }
  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.625rem; }
  .quick-item { background: var(--cow-surface-background); border: 1px solid var(--cow-surface-border); border-radius: 0.75rem; padding: 0.625rem 0.875rem; cursor: pointer; display:flex; align-items:center; gap: 0.625rem; }
  .quick-item .icon-sq { width: 2rem; height: 2rem; border-radius: 0.375rem; display:flex; align-items:center; justify-content:center; color: white; }
  .quick-item .qi-name { font-weight: 600; font-size: 0.875rem; }
  .quick-item .qi-sub { font-size: 0.6875rem; color: var(--cow-text-secondary); }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.875rem;
    background: var(--cow-blinds-medium);
    color: white;
    border-radius: 1rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-size: 0.875rem;
  }
</style>
</head>
<body>
<header class="toolbar">
  <h1>Mockup <b>C</b> — Hero replace ("cinema mode" durante play)</h1>
  <button class="toggle" id="toggle-play">⏯ Toggle: playing / idle</button>
  <span style="flex:1"></span>
  <a href="b-ribbon.html">‹ B</a>
  <a href="index.html">tutti</a>
</header>
<div class="stage"><div class="frame" id="frame"></div></div>

<script type="module">
import { MOCK, fmt, renderShell } from "./_shell.js";
const frame = document.getElementById("frame");
renderShell(frame, { hideMusicPill: true });

const hero = frame.querySelector(".hero");

const cinemaContent = `
  <div class="album-big"></div>
  <div class="player-info">
    <div class="top-row">
      <div></div>
      <div class="clock-mini">
        07:04
        <div class="date-mini">mercoledì 13 maggio 2026</div>
      </div>
    </div>
    <div>
      <div class="track-title">${MOCK.track.title}</div>
      <div class="track-meta">${MOCK.track.artist} · ${MOCK.track.album}</div>
      <div class="progress">
        <div class="bar"></div>
        <div class="time-row">
          <span>${fmt(MOCK.track.progress)}</span>
          <span>${fmt(MOCK.track.duration)}</span>
        </div>
      </div>
      <div class="controls-row">
        <button class="btn-icon">🔀</button>
        <button class="btn-icon">⏮</button>
        <button class="btn-icon primary">⏸</button>
        <button class="btn-icon">⏭</button>
        <button class="btn-icon">🔁</button>
        <span style="flex:1"></span>
        <span style="opacity:.6;font-size:0.8125rem">🔊 ${MOCK.volume}%  ·  📻 ${MOCK.device}</span>
      </div>
      <div class="browse-row">
        <button class="browse-btn">Browse Spotify…</button>
        <button class="browse-btn">Radio: Deejay</button>
      </div>
    </div>
  </div>
`;
const lastPlayedHtml = `
  <div class="last-played-inline">
    <div class="mini-art album-art"></div>
    <div>
      <div class="pre">Ultima ascoltata</div>
      <div class="name">${MOCK.track.title}</div>
    </div>
    <button class="resume">▶</button>
  </div>
`;

// Drawer for browse
const scrim = document.createElement("div");
scrim.className = "scrim";
frame.appendChild(scrim);
const drawer = document.createElement("div");
drawer.className = "music-drawer";
drawer.innerHTML = `
  <div class="drawer-handle"></div>
  <div class="tabs">
    <div class="tab" data-active>Spotify</div>
    <div class="tab">Radio</div>
    <div class="tab">Coda</div>
  </div>
  <input class="search-box" placeholder="Cerca su Spotify…" />
  <div style="font-size:0.75rem;font-weight:700;letter-spacing:0.0625rem;text-transform:uppercase;color:var(--cow-text-secondary)">LE TUE PLAYLIST</div>
  <div class="quick-grid">
    ${MOCK.playlists.map(p => `
      <div class="quick-item">
        <div class="icon-sq" style="background:linear-gradient(135deg,#1ed760,#0e7c3a)">♪</div>
        <div>
          <div class="qi-name">${p.name}</div>
          <div class="qi-sub">${p.desc}</div>
        </div>
      </div>`).join("")}
  </div>
  <div style="font-size:0.75rem;font-weight:700;letter-spacing:0.0625rem;text-transform:uppercase;color:var(--cow-text-secondary)">RADIO</div>
  <div class="quick-grid">
    ${MOCK.radios.map(r => `
      <div class="quick-item">
        <div class="icon-sq" style="background:${r.color}">${r.icon}</div>
        <div><div class="qi-name">${r.name}</div><div class="qi-sub">In diretta</div></div>
      </div>`).join("")}
  </div>
`;
frame.appendChild(drawer);

let playing = true;
function applyState() {
  if (playing) {
    hero.classList.add("cinema");
    hero.classList.remove("idle");
    hero.innerHTML = cinemaContent;
    hero.querySelectorAll(".browse-btn").forEach(b => b.addEventListener("click", open));
  } else {
    hero.classList.remove("cinema");
    hero.classList.add("idle");
    hero.innerHTML = `
      <div class="sun"></div>
      <div class="clock">07:04</div>
      <div class="date">mercoledì 13 maggio 2026</div>
      <div class="meteo">
        <div class="t">13°</div>
        <div class="d">Sereno · sens. 11° · vento 4 km/h</div>
      </div>
      ${lastPlayedHtml}
    `;
    hero.querySelector(".last-played-inline").addEventListener("click", open);
  }
}
applyState();
document.getElementById("toggle-play").addEventListener("click", () => { playing = !playing; applyState(); });

const open = () => { scrim.classList.add("open"); drawer.classList.add("open"); };
const close = () => { scrim.classList.remove("open"); drawer.classList.remove("open"); };
scrim.addEventListener("click", close);
</script>
</body>
</html>
